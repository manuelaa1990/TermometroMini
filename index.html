<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Temperatura y diferencial</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-s1: #38bdf8;
      --accent-s2: #f43f5e;
      --accent-delta: #10b981;
      --border: #334155;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .controls-top {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
    }

    .card.hidden {
      display: none;
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .value-s1 { color: var(--accent-s1); }
    .value-s2 { color: var(--accent-s2); }
    .value-delta { color: var(--accent-delta); }

    .card-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .card-inputs input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      width: 70px;
      font-size: 0.85rem;
    }

    .suggestion-card {
      border-left: 4px solid var(--warning);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1rem;
    }

    .suggestion-icon {
      font-size: 2rem;
    }

    .suggestion-content h3 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .suggestion-content p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .chart-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      position: relative;
      height: 450px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Panel de Monitoreo Térmico</h1>
    <div class="controls-top">
      <label>
        <input type="checkbox" id="chk-s1" checked onchange="toggleSerie('s1')">
        Sonda 1
      </label>
      <label>
        <input type="checkbox" id="chk-s2" checked onchange="toggleSerie('s2')">
        Sonda 2
      </label>
      <label>
        <input type="checkbox" id="chk-delta" checked onchange="toggleDeltaT()">
        Diferencial (ΔT)
      </label>
    </div>
  </header>

  <!-- TARJETAS SUPERIORES -->
  <div class="grid-cards">
    <!-- SONDA 1 -->
    <div class="card" id="card-s1">
      <div class="card-title">Sonda 1 (Entrada)</div>
      <div class="card-value value-s1" id="val-s1">-- °C</div>
      <div class="card-inputs">
        <label for="alarm1-input">Alarma Máx:</label>
        <input type="number" id="alarm1-input" value="40" step="0.5" onchange="updateSuggestion()"> °C
      </div>
    </div>

    <!-- SONDA 2 -->
    <div class="card" id="card-s2">
      <div class="card-title">Sonda 2 (Salida)</div>
      <div class="card-value value-s2" id="val-s2">-- °C</div>
      <div class="card-inputs">
        <label for="alarm2-input">Alarma Máx:</label>
        <input type="number" id="alarm2-input" value="40" step="0.5" onchange="updateSuggestion()"> °C
      </div>
    </div>

    <!-- DELTA T -->
    <div class="card" id="card-delta">
      <div class="card-title">Diferencial (ΔT)</div>
      <div class="card-value value-delta" id="val-delta">-- °C</div>
      <div class="card-inputs">
        <label for="alarmDeltaMin-input">Alarma Min:</label>
        <input type="number" id="alarmDeltaMin-input" value="0.5" step="0.1" onchange="updateSuggestion()"> °C
      </div>
    </div>
  </div>

  <!-- TARJETA DE SUGERENCIA / ALERTAS -->
  <div class="card suggestion-card" id="suggestion-box">
    <div class="suggestion-icon" id="suggestion-icon">💡</div>
    <div class="suggestion-content">
      <h3 id="suggestion-title">SUGERENCIA</h3>
      <p id="suggestion-text">Esperando datos...</p>
    </div>
  </div>

  <!-- GRÁFICO -->
  <div class="chart-container">
    <canvas id="tempChart"></canvas>
  </div>

  <script>
    /* ==========================================================
       DATOS DE PRUEBA Y CONFIGURACIÓN INICIAL
    ========================================================== */
    let rawData = [
      { time: "10:00", s1: 25.0, s2: 20.0 },
      { time: "10:01", s1: 25.2, s2: 20.1 },
      { time: "10:02", s1: 25.5, s2: 20.2 },
      { time: "10:03", s1: 26.0, s2: 20.3 },
      { time: "10:04", s1: 26.5, s2: 20.5 },
      { time: "10:05", s1: 27.0, s2: 20.8 }
    ];

    let chart = null;

    // Procesa las lecturas y calcula el diferencial en tiempo real
    function processRow(row) {
      const s1 = (typeof row.s1 === "number") ? row.s1 : null;
      const s2 = (typeof row.s2 === "number") ? row.s2 : null;
      const delta = (s1 !== null && s2 !== null) ? Math.abs(s1 - s2) : null;
      return { time: row.time, s1, s2, delta };
    }

    function getAlarmValue(id, defaultValue) {
      const input = document.getElementById(id);
      if (!input) return defaultValue;
      const val = parseFloat(input.value);
      return isNaN(val) ? defaultValue : val;
    }

    /* ==========================================================
       INICIALIZACIÓN DEL GRÁFICO
    ========================================================== */
    function initChart() {
      const ctx = document.getElementById("tempChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: rawData.map(d => d.time),
          datasets: [
            {
              label: "Sonda 1 (°C)",
              data: rawData.map(d => d.s1),
              borderColor: "#38bdf8",
              backgroundColor: "#38bdf820",
              tension: 0.2,
              hidden: false
            },
            {
              label: "Sonda 2 (°C)",
              data: rawData.map(d => d.s2),
              borderColor: "#f43f5e",
              backgroundColor: "#f43f5e20",
              tension: 0.2,
              hidden: false
            },
            {
              label: "ΔT (°C)",
              data: rawData.map(d => processRow(d).delta),
              borderColor: "#10b981",
              backgroundColor: "#10b98120",
              borderDash: [5, 5],
              tension: 0.2,
              hidden: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            },
            x: {
              grid: { color: "#334155" },
              ticks: { color: "#94a3b8" }
            }
          },
          plugins: {
            legend: { labels: { color: "#f8fafc" } }
          }
        }
      });
    }

    /* ==========================================================
       CONTROL DE VISIBILIDAD DE SERIES Y TARJETAS
    ========================================================== */
    function toggleSerie(serie) {
      if (!chart) return;
      const index = serie === "s1" ? 0 : 1;
      const checkbox = document.getElementById(`chk-${serie}`);
      chart.data.datasets[index].hidden = !checkbox.checked;
      chart.update();
    }

    function updateChartVisibility() {
      if (!chart) return;
      const showS1 = document.getElementById("chk-s1").checked;
      const showS2 = document.getElementById("chk-s2").checked;
      const showDelta = document.getElementById("chk-delta").checked;

      chart.data.datasets[0].hidden = !showS1;
      chart.data.datasets[1].hidden = !showS2;
      chart.data.datasets[2].hidden = !showDelta;

      chart.update();
    }

    function toggleDeltaT(showState) {
      const checkbox = document.getElementById("chk-delta");
      const card = document.getElementById("card-delta");

      if (typeof showState !== "boolean") {
        showState = checkbox.checked;
      } else {
        checkbox.checked = showState;
      }

      if (showState) {
        card.classList.remove("hidden");
      } else {
        card.classList.add("hidden");
      }

      updateChartVisibility();
      
      // Al cambiar la visibilidad de ΔT, volvemos a evaluar las alertas
      updateSuggestion();
    }

    /* ==========================================================
       ANÁLISIS DE TENDENCIAS
    ========================================================== */
    function analyzeTrend() {
      if (rawData.length < 3) return { state: "insuficiente" };
      
      const last = processRow(rawData[rawData.length - 1]).delta;
      const prev = processRow(rawData[rawData.length - 3]).delta;

      if (last === null || prev === null) return { state: "insuficiente" };

      const diff = last - prev;
      if (diff < -0.5) return { state: "disminuyendo", change: diff };
      if (diff > 0.5) return { state: "aumentando", change: diff };
      
      return { state: "estable", change: diff };
    }

    /* ==========================================================
       ACTUALIZACIÓN DE INTERFAZ Y REGLAS DE SUGERENCIAS
    ========================================================== */
    function updateSuggestion() {
      const title = document.getElementById("suggestion-title");
      text = document.getElementById("suggestion-text");
      const icon = document.getElementById("suggestion-icon");
      const deltaCard = document.getElementById("card-delta");

      // Comprobar si ΔT está activado tanto en la interfaz como en el checkbox
      const isDeltaVisible = document.getElementById("chk-delta").checked && 
                            !deltaCard.classList.contains("hidden");

      const p = rawData.length ? processRow(rawData[rawData.length - 1]) : null;

      if (!p) {
        title.textContent = "SUGERENCIA";
        text.textContent = "Esperando lecturas...";
        icon.textContent = "💡";
        return;
      }

      // Actualizar valores numéricos en tarjetas superiores
      document.getElementById("val-s1").textContent = p.s1 !== null ? `${p.s1.toFixed(1)} °C` : "-- °C";
      document.getElementById("val-s2").textContent = p.s2 !== null ? `${p.s2.toFixed(1)} °C` : "-- °C";
      document.getElementById("val-delta").textContent = p.delta !== null ? `${p.delta.toFixed(1)} °C` : "-- °C";

      const alarm1 = getAlarmValue("alarm1-input", 40);
      const alarm2 = getAlarmValue("alarm2-input", 40);
      const alarmDelta = getAlarmValue("alarmDeltaMin-input", 0.5);

      /*
        PRIORIDAD 1: ALARMAS INDIVIDUALES (SONDA 1 Y SONDA 2)
      */
      if (p.s1 !== null && p.s1 >= alarm1) {
        title.textContent = "ATENCIÓN";
        text.textContent = `Sonda 1 supera la alarma configurada (${alarm1.toFixed(1)} °C). Verifique la condición antes de continuar.`;
        icon.textContent = "⚠️";
        return;
      }

      if (p.s2 !== null && p.s2 >= alarm2) {
        title.textContent = "ATENCIÓN";
        text.textContent = `Sonda 2 supera la alarma configurada (${alarm2.toFixed(1)} °C). Verifique la condición antes de continuar.`;
        icon.textContent = "⚠️";
        return;
      }

      /*
        PRIORIDAD 2: ALARMA DE ΔT (SOLO SI ΔT ESTÁ VISIBLE/HABILITADO)
      */
      if (isDeltaVisible && p.delta !== null && p.delta <= alarmDelta) {
        title.textContent = "ΔT MUY BAJO";
        text.textContent = `La diferencia entre las sondas es de ${p.delta.toFixed(1)} °C. Conviene verificar la posición de las sondas y observar si el valor continúa bajo.`;
        icon.textContent = "⚠️";
        return;
      }

      /*
        PRIORIDAD 3: ANÁLISIS DE TENDENCIA DE ΔT (SOLO SI ΔT ESTÁ VISIBLE)
      */
      if (isDeltaVisible) {
        const trend = analyzeTrend();

        if (trend.state === "insuficiente") {
          title.textContent = "SUGERENCIA";
          text.textContent = "Se necesitan algunas lecturas más para analizar la tendencia del ΔT.";
          icon.textContent = "💡";
          return;
        }

        if (trend.state === "disminuyendo") {
          title.textContent = "ΔT DESCENDIENDO";
          text.textContent = `El ΔT ha disminuido aproximadamente ${Math.abs(trend.change).toFixed(1)} °C en las últimas lecturas. Observe si la tendencia continúa.`;
          icon.textContent = "📉";
          return;
        }

        if (trend.state === "aumentando") {
          title.textContent = "ΔT EN AUMENTO";
          text.textContent = `El ΔT ha subido aproximadamente ${trend.change.toFixed(1)} °C en las últimas lecturas.`;
          icon.textContent = "📈";
          return;
        }
      }

      // ESTADO NORMAL (Si las sondas están bien y/o ΔT está desactivado)
      title.textContent = "ESTADO NORMAL";
      text.textContent = "Las lecturas se encuentran dentro de los rangos normales establecidos.";
      icon.textContent = "✅";
    }

    // Inicializar al cargar la página
    window.addEventListener("DOMContentLoaded", () => {
      initChart();
      updateSuggestion();
    });
  </script>
</body>
</html>
