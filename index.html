<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diagramas de Mollier (p-h) Pro - Mediciones y Diagnóstico de Campo</title>
  
  <!-- CDN de Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100dvh;
      padding: 8px;
      gap: 8px;
    }

    .top-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 8px;
      flex-shrink: 0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .card h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      width: 100%;
    }

    .config-row .input-group-ref { flex: 2; min-width: 0; }
    .config-row .input-group-unit { flex: 1; min-width: 0; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      padding: 2px;
      transition: all 0.3s ease;
    }

    .input-group label {
      font-size: 0.6rem;
      font-weight: 600;
      margin-bottom: 2px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group input, .input-group select {
      padding: 2px 6px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
      background-color: #0f172a;
      color: #f8fafc;
      width: 100%;
      height: 28px;
    }

    .input-group select {
      cursor: pointer;
      border-color: #38bdf8;
      font-weight: 600;
    }

    .input-group select optgroup {
      background-color: #1e293b;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group select option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .action-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 32px;
    }

    .btn-primary { background-color: #0284c7; color: #ffffff; }
    .btn-primary:hover { background-color: #0369a1; }

    .btn-toggle { background-color: #334155; color: #cbd5e1; }
    .btn-toggle.active {
      background-color: #10b981;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .kpi-box {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .kpi-box .label {
      font-size: 0.58rem;
      color: #94a3b8;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-box .value {
      font-size: 0.82rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .diag-container {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      max-height: 110px;
      overflow-y: auto;
      transition: all 0.3s ease;
    }

    .diag-item {
      font-size: 0.7rem;
      margin-bottom: 4px;
      line-height: 1.25;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .diag-item:last-child {
      margin-bottom: 0;
    }

    .chart-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 6px 8px;
    }

    /* --- OPTIMIZACIÓN EXTREMA DE ALTURA PARA MÓVILES --- */
    .chart-container {
      width: 100%;
      height: 380px;
      min-height: 210px;
    }

    @media (max-width: 680px) {
      .chart-container {
        height: 210px !important; /* Altura compacta para evitar cortes y scroll */
      }
      .card {
        padding: 6px 8px;
      }
    }

    /* --- ESTILOS DE ALARMA INTERMITENTE POR CAMPO ESPECÍFICO --- */
    .alarm-field-active {
      animation: blink-field 0.8s infinite alternate !important;
      border-radius: 6px;
      padding: 2px 4px !important;
    }

    .alarm-field-active input {
      background-color: #7f1d1d !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      font-weight: bold;
    }

    .alarm-field-active label {
      color: #fca5a5 !important;
      font-weight: bold;
    }

    @keyframes blink-field {
      0% {
        background-color: rgba(239, 68, 68, 0.9);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      }
      100% {
        background-color: rgba(127, 29, 29, 0.3);
        box-shadow: 0 0 2px rgba(239, 68, 68, 0.2);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="top-panel">
      <div class="card" id="cardDatosCampo">
        <h2><span>Datos de Campo</span></h2>
        
        <div class="config-row">
          <div class="input-group input-group-ref">
            <label for="refSelect">Refrigerante</label>
            <select id="refSelect" onchange="guardarYActualizar()">
              <optgroup label="Puros y Tradicionales">
                <option value="R134a">R-134a</option>
                <option value="R22">R-22</option>
                <option value="R410A">R-410A</option>
                <option value="R32">R-32</option>
              </optgroup>
              <optgroup label="Hidrocarburos (HC)">
                <option value="R290">R-290 (Propano)</option>
                <option value="R600a">R-600a (Isobutano)</option>
              </optgroup>
              <optgroup label="Mezclas HFC (Serie 400 / 500)">
                <option value="R404A" selected>R-404A</option>
                <option value="R507A">R-507A</option>
                <option value="R407C">R-407C</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="pUnitSelect">U. Presión</label>
            <select id="pUnitSelect" onchange="cambiarUnidades()">
              <option value="psi" selected>PSI</option>
              <option value="bar">Bar</option>
              <option value="kpa">kPa</option>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="tUnitSelect">U. Temp</label>
            <select id="tUnitSelect" onchange="cambiarUnidades()">
              <option value="C" selected>°C</option>
              <option value="F">°F</option>
            </select>
          </div>
        </div>

        <div class="controls-grid">
          <div class="input-group" id="grpPSuct">
            <label for="pSuct" id="lblPSuct">P. Succión</label>
            <input type="number" id="pSuct" value="25" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpPDesc">
            <label for="pDesc" id="lblPDesc">P. Descarga</label>
            <input type="number" id="pDesc" value="290" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTSuct">
            <label for="tSuct" id="lblTSuct">T. Tubería Succ</label>
            <input type="number" id="tSuct" value="-10" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTLiq">
            <label for="tLiq" id="lblTLiq">T. Tubería Liq</label>
            <input type="number" id="tLiq" value="45" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTDescReal">
            <label for="tDescReal" id="lblTDescReal">T. Descarga</label>
            <input type="number" id="tDescReal" value="90" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="vVolt">Voltaje (V)</label>
            <input type="number" id="vVolt" value="220" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="iAmp">Amperaje (A)</label>
            <input type="number" id="iAmp" value="22" step="0.1" oninput="guardarYActualizar()">
          </div>
        </div>

      </div>

      <div class="card" id="cardIndicadores">
        <h2>Indicadores y Diagnóstico</h2>
        <div class="results-grid">
          <div class="kpi-box" style="border-left-color: #38bdf8;">
            <span class="label">Recalent.</span>
            <span class="value" id="kpiSH">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #10b981;">
            <span class="label">Subenfriam.</span>
            <span class="value" id="kpiSC">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #f59e0b;">
            <span class="label">Potencia Elec.</span>
            <span class="value" id="kpiKW">0.00 kW</span>
          </div>
          <div class="kpi-box" style="border-left-color: #a855f7;">
            <span class="label">Cap. Frig. (qn)</span>
            <span class="value" id="kpiqn">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ef4444;">
            <span class="label">Trabajo Comp (w)</span>
            <span class="value" id="kpiw">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ec4899;">
            <span class="label">COP Estimado</span>
            <span class="value" id="kpicop">0.0</span>
          </div>
        </div>

        <div class="diag-container" id="panelAlertas">
          <!-- Alertas técnicas dinámicas -->
        </div>
      </div>

    </header>

    <main class="card chart-card">
      <div class="action-bar">
        <button class="btn btn-toggle" id="btnZonaActiva" onclick="toggleZonaActiva()">
          🔍 Zoom Zona Activa: ON
        </button>
        <button class="btn btn-primary" onclick="descargarGrafica()">
          📷 Descargar PNG
        </button>
      </div>

      <div id="mollierPlot" class="chart-container"></div>
    </main>

  </div>

  <script>
    let zonaActivaHabilitada = true;
    let pUnitActual = 'psi';
    let tUnitActual = 'C';

    const P_ATM_BAR = 1.01325;
    const P_ATM_PSI = 14.696;
    const P_ATM_KPA = 101.325;

    const pUnits = {

      kpa: { factor: 100.0, label: 'kPa', atm: P_ATM_KPA }
    };

        dome: [

        ]
      },
      R22: {

        cpL: 1.28, cpV: 0.76, glide: 0.0, tDescMax: 115, shOptimo: [5, 10], scOptimo: [3, 6], rPMax: 7.5, esZeotropico: false,
        dome: [
          {p: 1.0, hL: 160, hV: 398.0, tSat: -40}, {p: 3.0, hL: 195, hV: 406.0, tSat: -15},
          {p: 7.0, hL: 230, hV: 413.0, tSat: 12},  {p: 15.0, hL: 270, hV: 416.0, tSat: 40},
          {p: 30.0, hL: 320, hV: 405.0, tSat: 72}, {p: 49.9, hL: 395, hV: 395, tSat: 96}
        ]
      },
      R404A: {
        nombre: "R-404A", criticalP: 36.8, xRange: [100, 450],
        cpL: 1.54, cpV: 0.88, glide: 0.8, tDescMax: 90, shOptimo: [4, 8], scOptimo: [4, 8], rPMax: 9.0, esZeotropico: true,
        dome: [
          {p: 1.2, hL: 142, hV: 381.0, tSat: -32}, {p: 3.0, hL: 166, hV: 379.8, tSat: -18},
          {p: 7.0, hL: 198, hV: 377.8, tSat: 5},   {p: 15.0, hL: 236, hV: 371.0, tSat: 32},
          {p: 25.0, hL: 271, hV: 360.0, tSat: 55}, {p: 36.8, hL: 325, hV: 325, tSat: 72}
        ]
      },
      R410A: {
        nombre: "R-410A", criticalP: 49.0, xRange: [130, 480],
        cpL: 1.68, cpV: 1.12, glide: 0.2, tDescMax: 105, shOptimo: [4, 8], scOptimo: [4, 8], rPMax: 6.0, esZeotropico: true,
        dome: [
          {p: 1.5, hL: 150, hV: 423.0, tSat: -42}, {p: 5.0, hL: 195, hV: 424.0, tSat: -20},
          {p: 12.0, hL: 238, hV: 422.0, tSat: 8},  {p: 22.0, hL: 280, hV: 415.0, tSat: 35},
          {p: 35.0, hL: 325, hV: 400.0, tSat: 58}, {p: 49.0, hL: 396, hV: 396, tSat: 72}
        ]
      },
      R32: {
        nombre: "R-32", criticalP: 57.8, xRange: [140, 580],
        cpL: 1.90, cpV: 1.25, glide: 0.0, tDescMax: 110, shOptimo: [4, 8], scOptimo: [3, 7], rPMax: 6.5, esZeotropico: false,
        dome: [
          {p: 1.5, hL: 150, hV: 512.0, tSat: -40}, {p: 6.0, hL: 210, hV: 520.0, tSat: -10},
          {p: 15.0, hL: 270, hV: 522.0, tSat: 20}, {p: 30.0, hL: 335, hV: 515.0, tSat: 50},
          {p: 57.8, hL: 470, hV: 470, tSat: 78}
        ]
      },
      R290: {
        nombre: "R-290", criticalP: 42.5, xRange: [170, 640],
        cpL: 2.45, cpV: 1.68, glide: 0.0, tDescMax: 85, shOptimo: [3, 7], scOptimo: [2, 5], rPMax: 8.0, esZeotropico: false,
        dome: [
          {p: 1.0, hL: 200, hV: 568.0, tSat: -40}, {p: 3.0, hL: 250, hV: 578.0, tSat: -22},
          {p: 8.0, hL: 320, hV: 585.0, tSat: 18},  {p: 16.0, hL: 390, hV: 582.0, tSat: 45},
          {p: 42.5, hL: 571, hV: 571, tSat: 96}
        ]
      },
      R600a: {
        nombre: "R-600a", criticalP: 36.5, xRange: [180, 620],
        cpL: 2.38, cpV: 1.52, glide: 0.0, tDescMax: 85, shOptimo: [3, 7], scOptimo: [2, 5], rPMax: 8.5, esZeotropico: false,
        dome: [
          {p: 0.8, hL: 200, hV: 545.0, tSat: -18}, {p: 3.0, hL: 260, hV: 570.0, tSat: 22},
          {p: 8.0, hL: 330, hV: 580.0, tSat: 56},  {p: 36.5, hL: 544, hV: 544, tSat: 135}
        ]
      },
      R507A: {
        nombre: "R-507A", criticalP: 37.1, xRange: [100, 440],
        cpL: 1.52, cpV: 0.89, glide: 0.0, tDescMax: 90, shOptimo: [4, 8], scOptimo: [4, 8], rPMax: 9.0, esZeotropico: false,
        dome: [
          {p: 1.2, hL: 140, hV: 378.0, tSat: -33}, {p: 3.0, hL: 164, hV: 376.0, tSat: -19},
          {p: 7.0, hL: 195, hV: 374.0, tSat: 4},   {p: 15.0, hL: 234, hV: 367.0, tSat: 31},
          {p: 37.1, hL: 322, hV: 322, tSat: 71}
        ]
      },
      R407C: {
        nombre: "R-407C", criticalP: 46.3, xRange: [130, 480],
        cpL: 1.50, cpV: 0.92, glide: 4.8, tDescMax: 105, shOptimo: [5, 9], scOptimo: [3, 7], rPMax: 8.0, esZeotropico: true,
        dome: [
          {p: 1.2, hL: 155, hV: 412.0, tSat: -35}, {p: 6.0, hL: 215, hV: 420.0, tSat: 5},
          {p: 15.0, hL: 270, hV: 415.0, tSat: 38}, {p: 46.3, hL: 414, hV: 414, tSat: 86}
        ]
      }
    };

    function actualizarEtiquetas() {
      document.getElementById('lblPSuct').innerText = `P. Succión (${pUnits[pUnitActual].label})`;
      document.getElementById('lblPDesc').innerText = `P. Descarga (${pUnits[pUnitActual].label})`;
      document.getElementById('lblTSuct').innerText = `T. Succ (°${tUnitActual})`;
      document.getElementById('lblTLiq').innerText = `T. Liq (°${tUnitActual})`;
      document.getElementById('lblTDescReal').innerText = `T. Desc (°${tUnitActual})`;
    }

    function cambiarUnidades() {
      const nuevaPUnit = document.getElementById('pUnitSelect').value;
      const nuevaTUnit = document.getElementById('tUnitSelect').value;

      const pFactorViejo = pUnits[pUnitActual].factor;
      const pFactorNuevo = pUnits[nuevaPUnit].factor;

      ['pSuct', 'pDesc'].forEach(id => {
        const elem = document.getElementById(id);
        const valBar = parseFloat(elem.value) / pFactorViejo;
        elem.value = (valBar * pFactorNuevo).toFixed(nuevaPUnit === 'psi' ? 0 : 1);
      });

      if (tUnitActual !== nuevaTUnit) {
        ['tSuct', 'tLiq', 'tDescReal'].forEach(id => {
          const elem = document.getElementById(id);
          let val = parseFloat(elem.value);
          if (nuevaTUnit === 'F') {
            elem.value = (val * 9/5 + 32).toFixed(1);
          } else {
            elem.value = ((val - 32) * 5/9).toFixed(1);
          }
        });
      }

      pUnitActual = nuevaPUnit;
      tUnitActual = nuevaTUnit;

      actualizarEtiquetas();
      guardarYActualizar();
    }

    function toggleZonaActiva() {
      zonaActivaHabilitada = !zonaActivaHabilitada;
      actualizarEstadoBotonZoom();
      guardarYActualizar();
    }

    function actualizarEstadoBotonZoom() {
      const btn = document.getElementById('btnZonaActiva');
      btn.innerText = `🔍 Zoom Zona Activa: ${zonaActivaHabilitada ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', zonaActivaHabilitada);
    }

    function guardarConfiguracion() {
      const data = {
        refSelect: document.getElementById('refSelect').value,
        pUnitSelect: document.getElementById('pUnitSelect').value,
        tUnitSelect: document.getElementById('tUnitSelect').value,
        pSuct: document.getElementById('pSuct').value,
        pDesc: document.getElementById('pDesc').value,
        tSuct: document.getElementById('tSuct').value,
        tLiq: document.getElementById('tLiq').value,
        tDescReal: document.getElementById('tDescReal').value,
        vVolt: document.getElementById('vVolt').value,
        iAmp: document.getElementById('iAmp').value,
        zonaActivaHabilitada: zonaActivaHabilitada
      };
      localStorage.setItem('mollier_app_data', JSON.stringify(data));
    }

    function cargarConfiguracion() {
      const saved = localStorage.getItem('mollier_app_data');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.refSelect) document.getElementById('refSelect').value = data.refSelect;
          if (data.pUnitSelect) document.getElementById('pUnitSelect').value = data.pUnitSelect;
          if (data.tUnitSelect) document.getElementById('tUnitSelect').value = data.tUnitSelect;
          if (data.pSuct !== undefined) document.getElementById('pSuct').value = data.pSuct;
          if (data.pDesc !== undefined) document.getElementById('pDesc').value = data.pDesc;
          if (data.tSuct !== undefined) document.getElementById('tSuct').value = data.tSuct;
          if (data.tLiq !== undefined) document.getElementById('tLiq').value = data.tLiq;
          if (data.tDescReal !== undefined) document.getElementById('tDescReal').value = data.tDescReal;
          if (data.vVolt !== undefined) document.getElementById('vVolt').value = data.vVolt;
          if (data.iAmp !== undefined) document.getElementById('iAmp').value = data.iAmp;
          if (data.zonaActivaHabilitada !== undefined) zonaActivaHabilitada = data.zonaActivaHabilitada;

          pUnitActual = document.getElementById('pUnitSelect').value;
          tUnitActual = document.getElementById('tUnitSelect').value;
          actualizarEstadoBotonZoom();
        } catch (e) {
          console.error("Error al cargar configuración", e);
        }
      }
    }

    function guardarYActualizar() {
      guardarConfiguracion();
      actualizarTodo();
    }

    function descargarGrafica() {
      const refKey = document.getElementById('refSelect').value;
      Plotly.downloadImage('mollierPlot', {
        format: 'png',
        width: 1200,
        height: 700,
        filename: `Mollier_Campo_${refKey}_${pUnitActual.toUpperCase()}`
      });
    }

    function getPropAtP(refData, pBarAbs) {
      const dome = refData.dome;
      if (pBarAbs <= dome[0].p) return dome[0];
      if (pBarAbs >= refData.criticalP) return dome[dome.length - 1];

      for (let i = 0; i < dome.length - 1; i++) {
        if (pBarAbs >= dome[i].p && pBarAbs <= dome[i+1].p) {
          const factor = (pBarAbs - dome[i].p) / (dome[i+1].p - dome[i].p);
          return {
            hL: dome[i].hL + factor * (dome[i+1].hL - dome[i].hL),
            hV: dome[i].hV + factor * (dome[i+1].hV - dome[i].hV),
            tSat: dome[i].tSat + factor * (dome[i+1].tSat - dome[i].tSat)
          };
        }
      }
      return dome[0];
    }

    function getZoneTraces(refData, minX, maxX) {
      const f = pUnits[pUnitActual].factor;
      const dome = refData.dome;

      const pVals = dome.map(pt => pt.p * f);
      const hLVals = dome.map(pt => pt.hL);
      const hVVals = dome.map(pt => pt.hV);

      const pTop = pVals[pVals.length - 1];
      const pBot = pVals[0];

      const liquidX = [minX, minX];
      const liquidY = [pBot, pTop];
      for (let i = dome.length - 1; i >= 0; i--) {
        liquidX.push(hLVals[i]);
        liquidY.push(pVals[i]);
      }

      const traceLiquid = {
        x: liquidX, y: liquidY, fill: 'toself',
        fillcolor: 'rgba(2, 132, 199, 0.22)', line: { color: 'transparent' },
        name: 'Líquido Subenfriado', showlegend: false, hoverinfo: 'none'
      };

      const satX = []; const satY = [];
      for (let i = 0; i < dome.length; i++) { satX.push(hLVals[i]); satY.push(pVals[i]); }
      for (let i = dome.length - 1; i >= 0; i--) { satX.push(hVVals[i]); satY.push(pVals[i]); }

      const traceSat = {
        x: satX, y: satY, fill: 'toself',
        fillcolor: 'rgba(16, 185, 129, 0.22)', line: { color: 'transparent' },
        name: 'Mezcla Saturada', showlegend: false, hoverinfo: 'none'
      };

      const vaporX = []; const vaporY = [];
      for (let i = 0; i < dome.length; i++) { vaporX.push(hVVals[i]); vaporY.push(pVals[i]); }
      vaporX.push(maxX, maxX);
      vaporY.push(pTop, pBot);

      const traceVapor = {
        x: vaporX, y: vaporY, fill: 'toself',
        fillcolor: 'rgba(245, 158, 11, 0.20)', line: { color: 'transparent' },
        name: 'Vapor Sobrecalentado', showlegend: false, hoverinfo: 'none'
      };

      return [traceLiquid, traceSat, traceVapor];
    }

    function getDomeTrace(refData) {
      const hVals = [];
      const pVals = [];
      const f = pUnits[pUnitActual].factor;

      refData.dome.forEach(pt => {
        hVals.push(pt.hL);
        pVals.push(pt.p * f);
      });

      for (let i = refData.dome.length - 1; i >= 0; i--) {
        hVals.push(refData.dome[i].hV);
        pVals.push(refData.dome[i].p * f);
      }

      return {
        x: hVals,
        y: pVals,
        mode: 'lines',
        name: `Domo ${refData.nombre}`,
        line: { color: '#38bdf8', width: 2.5, shape: 'spline', smoothing: 1.1 }
      };
    }

    function evaluarDiagnostico(refData, rP, tDescRealC, tLiqC, tSatCondC, SH, SC) {
      const alertas = [];
      let alarmaTDesc = false;
      let alarmaTLiq = false;

      if (tDescRealC > refData.tDescMax) {
        alarmaTDesc = true;
        alertas.push(`🔴 <b>CRÍTICO (T. Descarga ${tDescRealC.toFixed(0)}°C):</b> Supera el límite de ${refData.tDescMax}°C para ${refData.nombre}. Riesgo de degradar aceite.`);
      }

      if (tLiqC >= tSatCondC) {
        alarmaTLiq = true;
        alertas.push(`🔴 <b>ALERTA (T. Líquido ${tLiqC.toFixed(1)}°C):</b> Igual o superior a T. Sat (${tSatCondC.toFixed(1)}°C). Pérdida de subenfriamiento / Flash Gas.`);
      }

      if (rP > refData.rPMax) {
        alertas.push(`🔴 <b>Relación de Presión Excesiva (rP = ${rP.toFixed(1)} > ${refData.rPMax}):</b> Compresor fuera de envolvente. Condensador sucio o restricción.`);
      } else if (rP < 1.8 && rP > 1.0) {
        alertas.push(`🟡 <b>Relación de Presión Muy Baja (rP = ${rP.toFixed(1)}):</b> Ineficiencia por desgaste en válvulas o bypass interno.`);
      }

      if (SH < refData.shOptimo[0]) {
        alertas.push(`🔴 <b>Recalentamiento Crítico (< ${refData.shOptimo[0]} K):</b> Riesgo de retorno de líquido al compresor.`);
      } else if (SH > refData.shOptimo[1]) {
        alertas.push(`🟡 <b>Recalentamiento Alto (> ${refData.shOptimo[1]} K):</b> Evaporador subalimentado o falta de carga.`);
      }

      if (SC < refData.scOptimo[0] && !alarmaTLiq) {
        alertas.push(`🟡 <b>Subenfriamiento Bajo (< ${refData.scOptimo[0]} K):</b> Falta de refrigerante o baja transferencia en condensador.`);
      } else if (SC > refData.scOptimo[1]) {
        alertas.push(`🔵 <b>Subenfriamiento Alto (> ${refData.scOptimo[1]} K):</b> Exceso de carga o líquido retenido en condensador.`);
      }

      if (refData.esZeotropico && refData.glide > 0.5) {
        alertas.push(`ℹ️ <b>Mezcla Zeotrópica (Glide ${refData.glide} K):</b> Considere la diferencia de temperatura entre rocío y burbuja.`);
      }

      return { alertas, alarmaTDesc, alarmaTLiq };
    }

    function actualizarTodo() {
      const refKey = document.getElementById('refSelect').value;
      const refData = refrigerantes[refKey];
      const pf = pUnits[pUnitActual].factor;

      let pSuctInput = parseFloat(document.getElementById('pSuct').value);
      let pDescInput = parseFloat(document.getElementById('pDesc').value);

      if (isNaN(pSuctInput)) pSuctInput = 25;
      if (isNaN(pDescInput)) pDescInput = 290;

      const barFactor = (pUnitActual === 'psi') ? 14.5038 : ((pUnitActual === 'kpa') ? 100 : 1.0);
      const atmBar = 1.01325;

      const pSuctBarAbs = Math.max((pSuctInput / barFactor) + atmBar, 0.2);
      const pDescBarAbs = Math.min((pDescInput / barFactor) + atmBar, refData.criticalP - 0.2);

      let tSuctVal = parseFloat(document.getElementById('tSuct').value) || -10;
      let tLiqVal = parseFloat(document.getElementById('tLiq').value) || 45;
      let tDescRealVal = parseFloat(document.getElementById('tDescReal').value) || 90;

      let tSuctC = tSuctVal;
      let tLiqC = tLiqVal;
      let tDescRealC = tDescRealVal;

      if (tUnitActual === 'F') {
        tSuctC = (tSuctVal - 32) * 5/9;
        tLiqC = (tLiqVal - 32) * 5/9;
        tDescRealC = (tDescRealVal - 32) * 5/9;
      }

      const vVolt = parseFloat(document.getElementById('vVolt').value) || 220;
      const iAmp = parseFloat(document.getElementById('iAmp').value) || 0;
      const pKw = (vVolt * iAmp * 0.9) / 1000.0;

      const propEvap = getPropAtP(refData, pSuctBarAbs);
      const propCond = getPropAtP(refData, pDescBarAbs);

      const superHeatK = Math.max(tSuctC - propEvap.tSat, 0);
      const subCoolK = Math.max(propCond.tSat - tLiqC, 0);

      const h1 = propEvap.hV + (superHeatK * refData.cpV);
      const h3 = propCond.hL - (subCoolK * refData.cpL);
      const h4 = h3; 

      const qn = h1 - h4;

      const rP = pDescBarAbs / pSuctBarAbs;
      const deltaH_isentropico = h1 * 0.18 * Math.log(rP); 
      const deltaT_superheat_desc = Math.max(tDescRealC - propCond.tSat, 0);
      const h2_termico = propCond.hV + (deltaT_superheat_desc * refData.cpV);

      const h2 = Math.max(h1 + deltaH_isentropico, h2_termico);

      const w = h2 - h1;
      const cop = w > 0 ? (qn / w) : 0;

      document.getElementById('kpiSH').innerText = `${superHeatK.toFixed(1)} K`;
      document.getElementById('kpiSC').innerText = `${subCoolK.toFixed(1)} K`;
      document.getElementById('kpiKW').innerText = `${pKw.toFixed(2)} kW`;
      document.getElementById('kpiqn').innerText = `${qn.toFixed(1)} kJ/kg`;
      document.getElementById('kpiw').innerText = `${w.toFixed(1)} kJ/kg`;
      document.getElementById('kpicop').innerText = cop.toFixed(2);

      const { alertas, alarmaTDesc, alarmaTLiq } = evaluarDiagnostico(
        refData, rP, tDescRealC, tLiqC, propCond.tSat, superHeatK, subCoolK
      );
      
      const grpDesc = document.getElementById('grpTDescReal');
      const grpLiq = document.getElementById('grpTLiq');
      const panelAlertas = document.getElementById('panelAlertas');

      if (alarmaTDesc) {
        grpDesc.classList.add('alarm-field-active');
      } else {
        grpDesc.classList.remove('alarm-field-active');
      }

      if (alarmaTLiq) {
        grpLiq.classList.add('alarm-field-active');
      } else {
        grpLiq.classList.remove('alarm-field-active');
      }

      if (alertas.length === 0) {
        panelAlertas.innerHTML = `<div class="diag-item" style="color: #34d399;">✅ <b>Sistema Estable:</b> El equipo con ${refData.nombre} opera dentro de los parámetros de diseño previstos.</div>`;
      } else {
        panelAlertas.innerHTML = alertas.map(a => `<div class="diag-item" style="color: #cbd5e1;">${a}</div>`).join('');
      }

      const pSuctPlot = pSuctBarAbs * pf;
      const pDescPlot = pDescBarAbs * pf;

      const minX = refData.xRange[0];
      const maxX = refData.xRange[1];

      const zoneTraces = getZoneTraces(refData, minX, maxX);

      const cycleTrace = {
        x: [h1, h2, h3, h4, h1],
        y: [pSuctPlot, pDescPlot, pDescPlot, pSuctPlot, pSuctPlot],
        mode: 'lines+markers+text',
        name: 'Ciclo Operativo Real',
        text: ['1 (Succ)', '2 (Desc)', '3 (Liq)', '4 (Evap)', ''],
        textposition: ['bottom right', 'top right', 'top left', 'bottom left', ''],
        textfont: { color: '#ffffff', size: 9 },
        line: { color: '#f43f5e', width: 2.5 },
        marker: { size: 5, color: '#f59e0b' }
      };

      const cycleFillTrace = {
        x: [h1, h2, h3, h4],
        y: [pSuctPlot, pDescPlot, pDescPlot, pSuctPlot],
        fill: 'toself',
        fillcolor: 'rgba(244, 63, 94, 0.22)',
        line: { color: 'transparent' },
        name: 'Área del Ciclo',
        showlegend: false,
        hoverinfo: 'none'
      };

      const traces = [...zoneTraces, getDomeTrace(refData), cycleFillTrace, cycleTrace];

      let xRangeFinal, yRangeFinal;

      const maxH_Ciclo = Math.max(h1, h2, h3, h4);
      const minH_Ciclo = Math.min(h1, h2, h3, h4);

      // LÓGICA DE ZOOM ESTRICTO EN ZONA OPERATIVA PARA MÓVILES
      if (zonaActivaHabilitada) {
        const hMargin = (maxH_Ciclo - minH_Ciclo) * 0.08; // Margen reducido al 8%
        const minPLog = Math.log10(Math.min(pSuctPlot, pDescPlot)) - 0.05;
        const maxPLog = Math.log10(Math.max(pSuctPlot, pDescPlot)) + 0.05;

        xRangeFinal = [minH_Ciclo - hMargin, maxH_Ciclo + hMargin];
        yRangeFinal = [minPLog, maxPLog];
      } else {
        const pMinDome = refData.dome[0].p * pf;
        const pMaxDome = refData.criticalP * pf * 1.1;

        xRangeFinal = [minX, maxX];
        yRangeFinal = [
          Math.log10(pMinDome * 0.8),
          Math.log10(pMaxDome)
        ];
      }

      const layout = {
        /* Márgenes ultra reducidos para aprovechar el ancho total */
        margin: { l: 30, r: 10, t: 20, b: 25 },
        autosize: true,
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#0f172a',
        dragmode: false,
        showlegend: false,
        title: {
          text: `Diagrama Mollier p-h (${refData.nombre})`,
          font: { color: '#f8fafc', size: 10 }
        },
        xaxis: {
          title: { text: 'Entalpía (kJ/kg)', font: { color: '#94a3b8', size: 8 } },
          visible: true,
          showticklabels: true,
          tickfont: { color: '#94a3b8', size: 7 },
          showgrid: true,
          gridcolor: '#334155',
          range: xRangeFinal,
          fixedrange: true
        },
        yaxis: {
          title: { text: `P (${pUnits[pUnitActual].label})`, font: { color: '#94a3b8', size: 8 } },
          visible: true,
          showticklabels: true,
          tickfont: { color: '#94a3b8', size: 7 },
          showgrid: true,
          gridcolor: '#334155',
          type: 'log',
          range: yRangeFinal,
          fixedrange: true
        }
      };

      const config = {
        responsive: true,
        displayModeBar: false,
        scrollZoom: false
      };

      Plotly.react('mollierPlot', traces, layout, config);
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarConfiguracion();
      actualizarEtiquetas();
      actualizarTodo();
    });

    window.addEventListener('resize', () => {
      Plotly.Plots.resize('mollierPlot');
    });
  </script>
</body>
