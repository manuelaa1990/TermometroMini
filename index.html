<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Temperatura HVAC</title>
  
  <!-- Configuración de Ícono y PWA -->
  <link rel="icon" type="image/svg+xml" href="icono.svg">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">

  <div class="max-w-md md:max-w-3xl mx-auto space-y-3">
    
    <!-- Barra Superior Discreta: Batería, WiFi y Estado -->
    <div class="flex flex-wrap justify-between items-center bg-slate-800/60 border border-slate-700/50 px-3 py-1.5 rounded-xl text-xs gap-2">
      <div class="flex items-center gap-3 text-slate-400">
        <!-- Batería -->
        <div class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span class="font-medium text-slate-300 text-[11px]" id="bat-val">--%</span>
          <div class="w-8 bg-slate-700 h-1.5 rounded-full overflow-hidden">
            <div id="bat-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <!-- Nombre de Red WiFi -->
        <div class="flex items-center gap-1 text-[11px] text-slate-300 border-l border-slate-700 pl-2.5">
          <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.42 9.428a16 16 0 0121.16 0"/>
          </svg>
          <span id="wifi-val">Wifi: "Sin conexión"</span>
        </div>
      </div>

      <!-- Estado de Conexión -->
      <div id="status-badge" class="px-2.5 py-0.5 text-[10px] font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        Conectando...
      </div>
    </div>

    <!-- Título Principal -->
    <header class="text-center py-1">
      <h1 class="text-2xl font-bold text-sky-400">Monitor Temperatura HVAC</h1>
    </header>

    <!-- Bloque de Lecturas -->
    <div class="space-y-2">
      
      <!-- SONDA 1 -->
      <div id="card-s1" class="bg-slate-800 border border-slate-700/60 py-2.5 px-3 rounded-xl shadow-md text-center relative transition-all">
        <div class="flex justify-between items-center text-[10px] font-bold text-sky-400 uppercase tracking-wider px-1">
          <div class="flex items-center gap-1.5">
            <input type="checkbox" id="chk-s1" checked onchange="updateChartVisibility()" class="rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0 cursor-pointer" title="Mostrar/Ocultar en Gráfica">
            <span>SONDA 1</span>
          </div>
          <div class="flex items-center gap-1 text-[9px] text-slate-400">
            <span>Alarma:</span>
            <input type="number" id="alarm1-input" value="40" min="-50" max="100" step="0.5" oninput="saveAndRender()" class="w-12 bg-slate-900 border border-slate-700 text-sky-400 text-center rounded focus:outline-none py-0.5">
            <span>°C</span>
          </div>
        </div>
        <div id="temp1-val" class="text-2xl font-extrabold text-sky-400 mt-0.5 transition-colors">--.- °C</div>
        
        <div class="flex justify-center gap-4 text-[10px] font-mono text-slate-400 mt-1">
          <span>Mín: <strong id="s1-min" class="text-slate-200">--.-</strong> °C</span>
          <span>Máx: <strong id="s1-max" class="text-slate-200">--.-</strong> °C</span>
        </div>
        <div id="temp1-time" class="text-[9px] text-slate-500 mt-0.5">Esperando...</div>
      </div>

      <!-- BOTÓN INVERTIR -->
      <div class="flex justify-center -my-1">
        <button id="btn-invert" onclick="toggleInvert()" title="Invertir Sondas" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 transition-all shadow-md active:scale-90">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>
      </div>

      <!-- SONDA 2 -->
      <div id="card-s2" class="bg-slate-800 border border-slate-700/60 py-2.5 px-3 rounded-xl shadow-md text-center relative transition-all">
        <div class="flex justify-between items-center text-[10px] font-bold text-rose-400 uppercase tracking-wider px-1">
          <div class="flex items-center gap-1.5">
            <input type="checkbox" id="chk-s2" checked onchange="updateChartVisibility()" class="rounded bg-slate-900 border-slate-700 text-rose-500 focus:ring-0 cursor-pointer" title="Mostrar/Ocultar en Gráfica">
            <span>SONDA 2</span>
          </div>
          <div class="flex items-center gap-1 text-[9px] text-slate-400">
            <span>Alarma:</span>
            <input type="number" id="alarm2-input" value="40" min="-50" max="100" step="0.5" oninput="saveAndRender()" class="w-12 bg-slate-900 border border-slate-700 text-rose-400 text-center rounded focus:outline-none py-0.5">
            <span>°C</span>
          </div>
        </div>
        <div id="temp2-val" class="text-2xl font-extrabold text-rose-400 mt-0.5 transition-colors">--.- °C</div>
        
        <div class="flex justify-center gap-4 text-[10px] font-mono text-slate-400 mt-1">
          <span>Mín: <strong id="s2-min" class="text-slate-200">--.-</strong> °C</span>
          <span>Máx: <strong id="s2-max" class="text-slate-200">--.-</strong> °C</span>
        </div>
        <div id="temp2-time" class="text-[9px] text-slate-500 mt-0.5">Esperando...</div>
      </div>

      <!-- DIFERENCIAL (ΔT) -->
      <div id="card-delta" class="bg-slate-800 border border-slate-700/60 py-2.5 px-3 rounded-xl shadow-md text-center transition-all">
        <div class="flex justify-between items-center text-[10px] font-bold text-amber-400 uppercase tracking-wider px-1">
          <div class="flex items-center gap-1.5">
            <input type="checkbox" id="chk-delta" checked onchange="updateChartVisibility()" class="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-0 cursor-pointer" title="Mostrar/Ocultar en Gráfica">
            <span>DIFERENCIAL (ΔT)</span>
          </div>
          <div class="flex items-center gap-1 text-[9px] text-slate-400">
            <span class="text-rose-400 font-semibold">Alarma:</span>
            <input type="number" id="alarmDeltaMin-input" value="0.5" min="0" max="10" step="0.1" oninput="saveAndRender()" class="w-12 bg-slate-900 border border-slate-700 text-rose-400 text-center rounded focus:outline-none py-0.5 font-bold">
            <span>°C</span>
          </div>
        </div>
        <div id="delta-val" class="text-2xl font-extrabold text-amber-400 mt-0.5 transition-colors">--.- °C</div>
        
        <div class="flex justify-center gap-4 text-[10px] font-mono text-slate-400 mt-1">
          <span>Mín: <strong id="delta-min" class="text-slate-200">--.-</strong> °C</span>
          <span>Máx: <strong id="delta-max" class="text-slate-200">--.-</strong> °C</span>
        </div>
        <div id="delta-status-msg" class="text-[9px] text-slate-500 mt-0.5">|SONDA 1 - SONDA 2|</div>
      </div>

    </div>

    <!-- Navegación Simplificada de Gráfica -->
    <div class="bg-slate-800 border border-slate-700/60 p-2 rounded-xl shadow-md flex items-center justify-center gap-3">
      <button onclick="navigateWindow(-2)" title="Atrás 2 Horas" class="p-2 px-4 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>

      <button onclick="goLive()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-sky-600 hover:bg-sky-500 text-white transition flex items-center gap-1.5 active:scale-95">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Actual
      </button>

      <button id="btn-next" onclick="navigateWindow(2)" title="Adelante 2 Horas" class="p-2 px-4 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- Gráfica Histórica Auto-Escalable -->
    <div class="bg-slate-800 border border-slate-700/60 p-3 rounded-xl shadow-md">
      <div class="relative h-64 md:h-80">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ovaqbqkahttkmmtlmxha.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YXFicWthaHR0a21tdGxteGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDYxOTMsImV4cCI6MjEwNDIyMjE5M30.PpXfbHxW1-4ArrKuod0LLh8TZbjLO091r4DwkMNs3m8";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    let windowEndTime = new Date();
    let isLive = true;
    let rawData = [];
    let lastGlobalRecord = null;
    let isInverted = false;
    let lastVibrationTime = 0;

    // Configuración Chart.js con Auto-Escala Dinámica
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'SONDA 1 (°C)',
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.05)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 1,
            fill: true
          },
          {
            label: 'SONDA 2 (°C)',
            borderColor: '#f87171',
            backgroundColor: 'rgba(248, 113, 113, 0.05)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 1,
            fill: true
          },
          {
            label: 'DIFERENCIAL ΔT (°C)',
            borderColor: '#fbbf24',
            backgroundColor: 'rgba(251, 191, 36, 0.05)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 1,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { 
            ticks: { color: '#94a3b8', font: { size: 10 } }, 
            grid: { color: '#334155' } 
          },
          y: { 
            grace: '5%', // Ajusta la escala dinámicamente dando un 5% de holgura
            ticks: { color: '#94a3b8', font: { size: 10 } }, 
            grid: { color: '#334155' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f1f5f9', font: { size: 11 } } }
        }
      }
    });

    function updateChartVisibility() {
      const s1Vis = document.getElementById('chk-s1').checked;
      const s2Vis = document.getElementById('chk-s2').checked;
      const deltaVis = document.getElementById('chk-delta').checked;

      tempChart.setDatasetVisibility(0, s1Vis);
      tempChart.setDatasetVisibility(1, s2Vis);
      tempChart.setDatasetVisibility(2, deltaVis);
      tempChart.update();
    }

    function loadSavedAlarms() {
      const saved1 = localStorage.getItem('alarm1-input');
      if (saved1 !== null && saved1 !== '') document.getElementById('alarm1-input').value = saved1;

      const saved2 = localStorage.getItem('alarm2-input');
      if (saved2 !== null && saved2 !== '') document.getElementById('alarm2-input').value = saved2;

      const savedDeltaMin = localStorage.getItem('alarmDeltaMin-input');
      if (savedDeltaMin !== null && savedDeltaMin !== '') document.getElementById('alarmDeltaMin-input').value = savedDeltaMin;
    }

    function saveAndRender() {
      const a1 = document.getElementById('alarm1-input').value;
      const a2 = document.getElementById('alarm2-input').value;
      const adMin = document.getElementById('alarmDeltaMin-input').value;

      if (a1 !== '') localStorage.setItem('alarm1-input', a1);
      if (a2 !== '') localStorage.setItem('alarm2-input', a2);
      if (adMin !== '') localStorage.setItem('alarmDeltaMin-input', adMin);

      renderData();
    }

    function getAlarmValue(inputId, defaultVal) {
      const val = parseFloat(document.getElementById(inputId).value);
      return isNaN(val) ? defaultVal : val;
    }

    function toggleInvert() {
      isInverted = !isInverted;
      const btn = document.getElementById('btn-invert');

      if (isInverted) {
        btn.className = "p-2 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/60 transition-all shadow-md active:scale-90 ring-2 ring-amber-500/30";
      } else {
        btn.className = "p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 transition-all shadow-md active:scale-90";
      }

      renderData();
    }

    function processRow(row) {
      if (!row) return null;

      const raw1 = (row.temp1 === null || row.temp1 <= -127 || row.temp1 < -50 || row.temp1 > 125) ? null : row.temp1;
      const raw2 = (row.temp2 === null || row.temp2 <= -127 || row.temp2 < -50 || row.temp2 > 125) ? null : row.temp2;

      const s1 = isInverted ? raw2 : raw1;
      const s2 = isInverted ? raw1 : raw2;
      const delta = (s1 !== null && s2 !== null) ? Math.abs(s1 - s2) : null;
      const bateria = row.bateria !== undefined && row.bateria !== null ? row.bateria : null;
      const wifi = row.wifi || row.ssid || null;

      return { ...row, s1, s2, delta, bateria, wifi };
    }

    function triggerPhoneVibration() {
      const now = Date.now();
      if (now - lastVibrationTime > 8000) {
        if ('vibrate' in navigator) {
          navigator.vibrate([500, 200, 500, 200, 500]);
          lastVibrationTime = now;
        }
      }
    }

    function updateCards(processedRow) {
      const badge = document.getElementById('status-badge');
      const wifiEl = document.getElementById('wifi-val');

      if (!processedRow) {
        badge.textContent = "Sin Datos";
        badge.className = "px-2.5 py-0.5 text-[10px] font-semibold rounded-full bg-slate-800 text-slate-400 border border-slate-700";
        wifiEl.textContent = 'Wifi: "Sin conexión"';
        return;
      }

      const now = new Date().getTime();
      const lastReadingTime = new Date(processedRow.created_at).getTime();
      const diffSeconds = (now - lastReadingTime) / 1000;
      const isDeviceOnline = diffSeconds <= 30;

      if (!isLive) {
        badge.textContent = "Historial";
        badge.className = "px-2.5 py-0.5 text-[10px] font-semibold rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/40";
      } else if (isDeviceOnline) {
        badge.textContent = "Online";
        badge.className = "px-2.5 py-0.5 text-[10px] font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
      } else {
        badge.textContent = "Offline";
        badge.className = "px-2.5 py-0.5 text-[10px] font-semibold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse";
      }

      if (isDeviceOnline && processedRow.wifi) {
        wifiEl.textContent = `Wifi: "${processedRow.wifi}"`;
      } else {
        wifiEl.textContent = 'Wifi: "Sin conexión"';
      }

      const s1Val = processedRow.s1;
      const s2Val = processedRow.s2;
      const deltaVal = processedRow.delta;

      const temp1El = document.getElementById('temp1-val');
      const temp2El = document.getElementById('temp2-val');
      const deltaEl = document.getElementById('delta-val');
      const deltaMsgEl = document.getElementById('delta-status-msg');

      temp1El.textContent = s1Val !== null ? `${s1Val.toFixed(1)} °C` : "DESC";
      temp2El.textContent = s2Val !== null ? `${s2Val.toFixed(1)} °C` : "DESC";
      deltaEl.textContent = deltaVal !== null ? `${deltaVal.toFixed(1)} °C` : "--.- °C";
      
      const dateObj = new Date(processedRow.created_at);
      const isToday = new Date().toDateString() === dateObj.toDateString();
      const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = isToday ? '' : `${dateObj.getDate()}/${dateObj.getMonth() + 1} `;

      document.getElementById('temp1-time').textContent = `Lectura: ${dateStr}${timeStr}`;
      document.getElementById('temp2-time').textContent = `Lectura: ${dateStr}${timeStr}`;

      if (processedRow.bateria !== null && processedRow.bateria !== undefined) {
        const bat = Math.max(0, Math.min(100, processedRow.bateria));
        const bar = document.getElementById('bat-bar');
        document.getElementById('bat-val').textContent = `${bat.toFixed(0)}%`;
        bar.style.width = `${bat}%`;

        if (bat > 50) bar.className = "bg-emerald-500 h-full transition-all duration-500";
        else if (bat > 20) bar.className = "bg-amber-500 h-full transition-all duration-500";
        else bar.className = "bg-rose-500 h-full transition-all duration-500";
      }

      const alarm1 = getAlarmValue('alarm1-input', 40);
      const alarm2 = getAlarmValue('alarm2-input', 40);
      const alarmDeltaMin = getAlarmValue('alarmDeltaMin-input', 0.5);

      if (s1Val !== null && s1Val >= alarm1) {
        temp1El.className = "text-2xl font-extrabold bg-yellow-500 text-slate-900 animate-pulse rounded my-1 mx-8 py-0.5 transition-colors";
      } else {
        temp1El.className = "text-2xl font-extrabold text-sky-400 mt-0.5 transition-colors";
      }

      if (s2Val !== null && s2Val >= alarm2) {
        temp2El.className = "text-2xl font-extrabold bg-yellow-500 text-slate-900 animate-pulse rounded my-1 mx-8 py-0.5 transition-colors";
      } else {
        temp2El.className = "text-2xl font-extrabold text-rose-400 mt-0.5 transition-colors";
      }

      if (deltaVal !== null && deltaVal <= alarmDeltaMin) {
        deltaEl.className = "text-2xl font-extrabold bg-rose-600 text-white animate-pulse rounded my-1 mx-8 py-0.5 transition-colors shadow-lg shadow-rose-600/50";
        deltaMsgEl.textContent = "⚠️ ALERTA: ΔT MUY BAJO - POSIBLE RETORNO DE LÍQUIDO";
        deltaMsgEl.className = "text-[10px] text-rose-400 font-bold mt-0.5 animate-pulse";

        if (isLive) {
          triggerPhoneVibration();
        }
      } else {
        deltaEl.className = "text-2xl font-extrabold text-amber-400 mt-0.5 transition-colors";
        deltaMsgEl.textContent = "|SONDA 1 - SONDA 2|";
        deltaMsgEl.className = "text-[9px] text-slate-500 mt-0.5";
      }
    }

    function renderData() {
      tempChart.data.labels = [];
      tempChart.data.datasets[0].data = [];
      tempChart.data.datasets[1].data = [];
      tempChart.data.datasets[2].data = [];

      let s1Vals = [];
      let s2Vals = [];
      let deltaVals = [];

      rawData.forEach(row => {
        const p = processRow(row);
        const timeLabel = new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        tempChart.data.labels.push(timeLabel);
        tempChart.data.datasets[0].data.push(p.s1);
        tempChart.data.datasets[1].data.push(p.s2);
        tempChart.data.datasets[2].data.push(p.delta);

        if (p.s1 !== null && p.s1 !== undefined) s1Vals.push(p.s1);
        if (p.s2 !== null && p.s2 !== undefined) s2Vals.push(p.s2);
        if (p.delta !== null && p.delta !== undefined) deltaVals.push(p.delta);
      });

      document.getElementById('s1-min').textContent = s1Vals.length > 0 ? Math.min(...s1Vals).toFixed(1) : "--.-";
      document.getElementById('s1-max').textContent = s1Vals.length > 0 ? Math.max(...s1Vals).toFixed(1) : "--.-";

      document.getElementById('s2-min').textContent = s2Vals.length > 0 ? Math.min(...s2Vals).toFixed(1) : "--.-";
      document.getElementById('s2-max').textContent = s2Vals.length > 0 ? Math.max(...s2Vals).toFixed(1) : "--.-";

      document.getElementById('delta-min').textContent = deltaVals.length > 0 ? Math.min(...deltaVals).toFixed(1) : "--.-";
      document.getElementById('delta-max').textContent = deltaVals.length > 0 ? Math.max(...deltaVals).toFixed(1) : "--.-";

      updateChartVisibility();

      const activeRecord = (rawData.length > 0) ? rawData[rawData.length - 1] : lastGlobalRecord;
      updateCards(processRow(activeRecord));
    }

    async function fetchWindowData() {
      if (isLive) {
        windowEndTime = new Date();
      }

      const windowStartTime = new Date(windowEndTime.getTime() - TWO_HOURS_MS);

      const btnNext = document.getElementById('btn-next');
      btnNext.disabled = (windowEndTime >= new Date());

      const { data, error } = await supabaseClient
        .from('lecturas_temperatura')
        .select('*')
        .gte('created_at', windowStartTime.toISOString())
        .lte('created_at', windowEndTime.toISOString())
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error al cargar datos:', error);
        return;
      }

      rawData = data || [];

      if (isLive && rawData.length === 0) {
        const { data: latestData } = await supabaseClient
          .from('lecturas_temperatura')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(1);

        if (latestData && latestData.length > 0) {
          lastGlobalRecord = latestData[0];
        } else {
          lastGlobalRecord = null;
        }
      } else if (rawData.length > 0) {
        lastGlobalRecord = rawData[rawData.length - 1];
      }

      renderData();
    }

    function navigateWindow(hoursOffset) {
      isLive = false;
      windowEndTime = new Date(windowEndTime.getTime() + (hoursOffset * 60 * 60 * 1000));
      
      if (windowEndTime >= new Date()) {
        goLive();
        return;
      }

      fetchWindowData();
    }

    function goLive() {
      isLive = true;
      windowEndTime = new Date();
      fetchWindowData();
    }

    supabaseClient
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'lecturas_temperatura' }, payload => {
        if (isLive) {
          rawData.push(payload.new);
          lastGlobalRecord = payload.new;
          const cutoff = new Date(Date.now() - TWO_HOURS_MS).toISOString();
          rawData = rawData.filter(r => r.created_at >= cutoff);
          renderData();
        }
      })
      .subscribe();

    loadSavedAlarms();
    fetchWindowData();

    setInterval(() => {
      if (isLive) {
        fetchWindowData();
      }
    }, 10000);

    setInterval(() => {
      if (isLive) {
        const activeRecord = (rawData.length > 0) ? rawData[rawData.length - 1] : lastGlobalRecord;
        if (activeRecord) {
          updateCards(processRow(activeRecord));
        }
      }
    }, 5000);

  </script>
</body>
</html>
