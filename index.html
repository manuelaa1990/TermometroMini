<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría HVAC - Monitor en Tiempo Real</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Encabezado -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-sky-400">Panel de Monitoreo HVAC</h1>
        <p class="text-sm text-slate-400">Sistema de telemetría de temperatura en tiempo real</p>
      </div>
      <div id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        Conectando...
      </div>
    </header>

    <!-- Tarjetas de Lectura Actual -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 border border-slate-700/60 p-5 rounded-xl shadow-lg">
        <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Sonda 1 (Temp 1)</div>
        <div id="temp1-val" class="text-4xl font-extrabold text-sky-400 mt-2">--.- °C</div>
        <div id="temp1-time" class="text-xs text-slate-500 mt-1">Esperando datos...</div>
      </div>

      <div class="bg-slate-800 border border-slate-700/60 p-5 rounded-xl shadow-lg">
        <div class="text-xs font-medium text-slate-400 uppercase tracking-wider">Sonda 2 (Temp 2)</div>
        <div id="temp2-val" class="text-4xl font-extrabold text-emerald-400 mt-2">--.- °C</div>
        <div id="temp2-time" class="text-xs text-slate-500 mt-1">Esperando datos...</div>
      </div>
    </div>

    <!-- Gráfica Histórica -->
    <div class="bg-slate-800 border border-slate-700/60 p-5 rounded-xl shadow-lg">
      <h2 class="text-sm font-medium text-slate-300 mb-4">Historial Reciente (Últimas 20 lecturas)</h2>
      <div class="relative h-72">
        <canvas id="tempChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ovaqbqkahttkmmtlmxha.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YXFicWthaHR0a21tdGxteGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDYxOTMsImV4cCI6MjEwNDIyMjE5M30.PpXfbHxW1-4ArrKuod0LLh8TZbjLO091r4DwkMNs3m8";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicialización de la gráfica
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Temp 1 (°C)',
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            data: [],
            borderWidth: 2,
            tension: 0.3,
            fill: true
          },
          {
            label: 'Temp 2 (°C)',
            borderColor: '#34d399',
            backgroundColor: 'rgba(52, 211, 153, 0.1)',
            data: [],
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        },
        plugins: {
          legend: { labels: { color: '#f1f5f9' } }
        }
      }
    });

    // Cargar historial inicial
    async function fetchInitialData() {
      const { data, error } = await supabaseClient
        .from('lecturas_temperatura')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        console.error('Error al obtener datos:', error);
        return;
      }

      if (data && data.length > 0) {
        const reversed = data.reverse();
        reversed.forEach(row => addRowToChart(row));
        updateCards(reversed[reversed.length - 1]);
      }
      
      const badge = document.getElementById('status-badge');
      badge.textContent = "Sistema En Vivo";
      badge.className = "px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
    }

    function addRowToChart(row) {
      const timeLabel = new Date(row.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      tempChart.data.labels.push(timeLabel);
      tempChart.data.datasets[0].data.push(row.temp1);
      tempChart.data.datasets[1].data.push(row.temp2);

      if (tempChart.data.labels.length > 20) {
        tempChart.data.labels.shift();
        tempChart.data.datasets[0].data.shift();
        tempChart.data.datasets[1].data.shift();
      }
      tempChart.update();
    }

    function updateCards(row) {
      document.getElementById('temp1-val').textContent = row.temp1 !== null ? `${row.temp1.toFixed(2)} °C` : "DESC";
      document.getElementById('temp2-val').textContent = row.temp2 !== null ? `${row.temp2.toFixed(2)} °C` : "DESC";
      
      const formattedTime = new Date(row.created_at).toLocaleString();
      document.getElementById('temp1-time').textContent = `Última lectura: ${formattedTime}`;
      document.getElementById('temp2-time').textContent = `Última lectura: ${formattedTime}`;
    }

    // Suscripción Realtime a inserciones en tiempo real
    supabaseClient
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'lecturas_temperatura' }, payload => {
        addRowToChart(payload.new);
        updateCards(payload.new);
      })
      .subscribe();

    fetchInitialData();
  </script>
</body>
</html>
