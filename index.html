<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemetría HVAC - Monitor en Tiempo Real</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-6xl mx-auto space-y-5">
    
    <!-- Barra Superior: Batería discreta en esquina superior izquierda | Estado a la derecha -->
    <div class="flex justify-between items-center bg-slate-800/60 border border-slate-700/50 px-4 py-2 rounded-xl text-xs">
      <!-- BATERÍA (Esquina superior izquierda, bajo perfil) -->
      <div class="flex items-center gap-2 text-slate-400">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="font-medium text-slate-300" id="bat-val">--%</span>
        <div class="w-12 bg-slate-700 h-1.5 rounded-full overflow-hidden">
          <div id="bat-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- ESTADO DE CONEXIÓN -->
      <div id="status-badge" class="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        Conectando...
      </div>
    </div>

    <!-- Título Principal -->
    <header class="text-center sm:text-left">
      <h1 class="text-2xl font-bold text-sky-400">Panel de Monitoreo HVAC</h1>
      <p class="text-xs text-slate-400">Telemetría de temperatura en vivo</p>
    </header>

    <!-- Tarjetas de Lectura con Botón de Invertir (Flechas) en el centro -->
    <div class="grid grid-cols-1 md:grid-cols-11 gap-3 items-center">
      
      <!-- SONDA 1 -->
      <div class="md:col-span-3 bg-slate-800 border border-slate-700/60 p-4 rounded-xl shadow-md">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">SONDA 1</div>
        <div id="temp1-val" class="text-3xl font-extrabold text-sky-400 mt-1">--.- °C</div>
        <div id="temp1-time" class="text-[10px] text-slate-500 mt-1">Esperando...</div>
      </div>

      <!-- BOTÓN INVERTIR SONDAS (Sólo 2 flechas en el centro) -->
      <div class="md:col-span-1 flex justify-center py-1 md:py-0">
        <button onclick="toggleInvert()" title="Invertir Sondas" class="p-3 rounded-full bg-slate-800 hover:bg-slate-700 text-sky-400 border border-sky-500/30 transition-all shadow-md active:scale-95 hover:scale-110">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
          </svg>
        </button>
      </div>

      <!-- SONDA 2 -->
      <div class="md:col-span-3 bg-slate-800 border border-slate-700/60 p-4 rounded-xl shadow-md">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">SONDA 2</div>
        <div id="temp2-val" class="text-3xl font-extrabold text-emerald-400 mt-1">--.- °C</div>
        <div id="temp2-time" class="text-[10px] text-slate-500 mt-1">Esperando...</div>
      </div>

      <!-- DIFERENCIAL (ΔT) -->
      <div class="md:col-span-4 bg-slate-800 border border-slate-700/60 p-4 rounded-xl shadow-md">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">DIFERENCIAL (ΔT)</div>
        <div id="delta-val" class="text-3xl font-extrabold text-amber-400 mt-1">--.- °C</div>
        <div class="text-[10px] text-slate-500 mt-1">|SONDA 1 - SONDA 2|</div>
      </div>

    </div>

    <!-- Navegación por Botones de Ventana de 2 Horas -->
    <div class="bg-slate-800 border border-slate-700/60 p-3 rounded-xl shadow-md flex flex-col sm:flex-row items-center justify-between gap-3">
      <button onclick="navigateWindow(-2)" class="w-full sm:w-auto px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        2h Anteriores
      </button>

      <div class="text-center">
        <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Ventana Visualizada</span>
        <span id="window-label" class="text-xs font-mono font-bold text-sky-400">Cargando...</span>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button id="btn-next" onclick="navigateWindow(2)" class="flex-1 sm:flex-none px-4 py-2 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition flex items-center justify-center gap-1.5 disabled:opacity-30 disabled:cursor-not-allowed">
          2h Siguientes
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
        <button onclick="goLive()" class="px-3 py-2 text-xs font-semibold rounded-lg bg-sky-600 hover:bg-sky-500 text-white transition flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          En Vivo
        </button>
      </div>
    </div>

    <!-- Gráfica Histórica Escala -50°C a 100°C -->
    <div class="bg-slate-800 border border-slate-700/60 p-5 rounded-xl shadow-md">
      <div class="relative h-80">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ovaqbqkahttkmmtlmxha.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92YXFicWthaHR0a21tdGxteGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDYxOTMsImV4cCI6MjEwNDIyMjE5M30.PpXfbHxW1-4ArrKuod0LLh8TZbjLO091r4DwkMNs3m8";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    let windowEndTime = new Date();
    let isLive = true;
    let rawData = [];
    let isInverted = false;

    // Chart.js con escala fija de -50 °C a 100 °C
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'SONDA 1 (°C)',
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.05)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 1.5,
            fill: true
          },
          {
            label: 'SONDA 2 (°C)',
            borderColor: '#34d399',
            backgroundColor: 'rgba(52, 211, 153, 0.05)',
            data: [],
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 1.5,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { 
            min: -50,
            max: 100,
            ticks: { color: '#94a3b8', stepSize: 25 }, 
            grid: { color: '#334155' },
            title: { display: true, text: 'Temperatura (°C)', color: '#64748b' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f1f5f9' } }
        }
      }
    });

    function toggleInvert() {
      isInverted = !isInverted;
      renderData();
    }

    function processRow(row) {
      const raw1 = row.temp1;
      const raw2 = row.temp2;
      const s1 = isInverted ? raw2 : raw1;
      const s2 = isInverted ? raw1 : raw2;
      const delta = (s1 !== null && s2 !== null) ? Math.abs(s1 - s2) : null;
      const bateria = row.bateria !== undefined && row.bateria !== null ? row.bateria : null;

      return { ...row, s1, s2, delta, bateria };
    }

    function updateCards(processedRow) {
      if (!processedRow) return;

      document.getElementById('temp1-val').textContent = processedRow.s1 !== null ? `${processedRow.s1.toFixed(2)} °C` : "DESC";
      document.getElementById('temp2-val').textContent = processedRow.s2 !== null ? `${processedRow.s2.toFixed(2)} °C` : "DESC";
      document.getElementById('delta-val').textContent = processedRow.delta !== null ? `${processedRow.delta.toFixed(2)} °C` : "--.- °C";
      
      const formattedTime = new Date(processedRow.created_at).toLocaleTimeString();
      document.getElementById('temp1-time').textContent = `Lectura: ${formattedTime}`;
      document.getElementById('temp2-time').textContent = `Lectura: ${formattedTime}`;

      // Actualizar Batería discreta en top-left
      if (processedRow.bateria !== null) {
        const bat = Math.max(0, Math.min(100, processedRow.bateria));
        const bar = document.getElementById('bat-bar');
        document.getElementById('bat-val').textContent = `${bat.toFixed(0)}%`;
        bar.style.width = `${bat}%`;

        if (bat > 50) bar.className = "bg-emerald-500 h-full transition-all duration-500";
        else if (bat > 20) bar.className = "bg-amber-500 h-full transition-all duration-500";
        else bar.className = "bg-rose-500 h-full transition-all duration-500";
      }
    }

    function renderData() {
      tempChart.data.labels = [];
      tempChart.data.datasets[0].data = [];
      tempChart.data.datasets[1].data = [];

      rawData.forEach(row => {
        const p = processRow(row);
        const timeLabel = new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        tempChart.data.labels.push(timeLabel);
        tempChart.data.datasets[0].data.push(p.s1);
        tempChart.data.datasets[1].data.push(p.s2);
      });

      tempChart.update();

      if (rawData.length > 0) {
        updateCards(processRow(rawData[rawData.length - 1]));
      }
    }

    // Consulta de ventana de 2 horas
    async function fetchWindowData() {
      if (isLive) {
        windowEndTime = new Date();
      }

      const windowStartTime = new Date(windowEndTime.getTime() - TWO_HOURS_MS);

      // Formato para la etiqueta textual del rango
      const fmtOptions = { hour: '2-digit', minute: '2-digit' };
      const startStr = windowStartTime.toLocaleTimeString([], fmtOptions);
      const endStr = windowEndTime.toLocaleTimeString([], fmtOptions);
      const dateStr = windowStartTime.toLocaleDateString([], { month: 'short', day: 'numeric' });
      document.getElementById('window-label').textContent = `${dateStr} | ${startStr} - ${endStr}`;

      // Deshabilitar botón "Siguiente" si estamos en el presente
      const btnNext = document.getElementById('btn-next');
      btnNext.disabled = (windowEndTime >= new Date());

      const { data, error } = await supabaseClient
        .from('lecturas_temperatura')
        .select('*')
        .gte('created_at', windowStartTime.toISOString())
        .lte('created_at', windowEndTime.toISOString())
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Error al cargar datos:', error);
        return;
      }

      rawData = data || [];
      renderData();

      const badge = document.getElementById('status-badge');
      if (isLive) {
        badge.textContent = "Sistema En Vivo";
        badge.className = "px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      } else {
        badge.textContent = "Navegando Historial";
        badge.className = "px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20";
      }
    }

    function navigateWindow(hoursOffset) {
      isLive = false;
      windowEndTime = new Date(windowEndTime.getTime() + (hoursOffset * 60 * 60 * 1000));
      
      // Si se avanza más allá del momento actual, volver a Live
      if (windowEndTime >= new Date()) {
        goLive();
        return;
      }

      fetchWindowData();
    }

    function goLive() {
      isLive = true;
      windowEndTime = new Date();
      fetchWindowData();
    }

    // Suscripción Realtime para nuevas lecturas
    supabaseClient
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'lecturas_temperatura' }, payload => {
        if (isLive) {
          rawData.push(payload.new);
          // Mantener sólo las lecturas de las últimas 2 horas
          const cutoff = new Date(Date.now() - TWO_HOURS_MS).toISOString();
          rawData = rawData.filter(r => r.created_at >= cutoff);
          renderData();
        }
      })
      .subscribe();

    fetchWindowData();
  </script>
</body>
</html>
