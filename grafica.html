<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gráfica Live · Termómetro</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Versiones fijadas. hammerjs es necesario para pan/pinch táctil del plugin de zoom -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #chart-container {
      position: absolute;
      inset: 0;
      touch-action: none;
    }

    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #topbar.hidden-ui {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }

    #bottombar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #bottombar.hidden-ui {
      opacity: 0;
      transform: translateY(100%);
      pointer-events: none;
    }

    /* Hint de girar teléfono */
    #portrait-hint {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 100;
      text-align: center;
      padding: 2rem;
    }
    @media (orientation: portrait) and (max-width: 1023px) {
      #portrait-hint.force-hint { display: flex; }
    }
    #portrait-hint.hidden { display: none !important; }

    .rotate-icon {
      animation: rotate 2s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes rotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    /* Rango de horas */
    .range-btn {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      background: transparent;
      border: 1px solid #334155;
      transition: all 0.15s;
      cursor: pointer;
    }
    .range-btn.active {
      background: #0284c7;
      color: white;
      border-color: #0284c7;
    }
    .range-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .nav-btn {
      min-width: 2.25rem;
      padding: 4px 12px;
      font-size: 16px;
      line-height: 1;
    }

    .ui-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-color: rgba(51, 65, 85, 0.6);
    }

    /* ePaper */
    body.epaper-mode {
      background: #fff !important;
      color: #000 !important;
    }
    body.epaper-mode .ui-bar {
      background: rgba(255, 255, 255, 0.95) !important;
      color: #000 !important;
      border-color: #000 !important;
    }
    body.epaper-mode #topbar,
    body.epaper-mode #bottombar,
    body.epaper-mode #topbar *,
    body.epaper-mode #bottombar * {
      color: #000 !important;
    }
    body.epaper-mode #topbar button:not(.range-btn),
    body.epaper-mode #bottombar button:not(.series-toggle) {
      background: #fff !important;
      border: 2px solid #000 !important;
    }
    body.epaper-mode .range-btn {
      border-color: #000;
      color: #000;
    }
    body.epaper-mode .range-btn.active {
      background: #000;
      color: #fff !important;
    }

    /* Pills del selector de series */
    .series-toggle {
      border-color: #334155;
      background: #1e293b;
      color: #94a3b8;
      opacity: 0.45;
    }
    .series-toggle.active {
      opacity: 1;
      color: #e2e8f0;
      background: #334155;
      border-color: #475569;
    }
    body.epaper-mode .series-toggle {
      background: #fff !important;
      border-color: #000 !important;
      color: #000 !important;
      opacity: 0.4;
    }
    body.epaper-mode .series-toggle.active {
      opacity: 1;
      background: #000 !important;
      color: #fff !important;
      border-color: #000 !important;
    }
    body.epaper-mode .series-toggle.active span {
      color: #fff !important;
    }
  </style>
</head>

<body>

<!-- HINT DE GIRAR TELÉFONO -->
<div id="portrait-hint">
  <div>
    <div class="rotate-icon text-6xl mb-4">📱</div>
    <div class="text-xl font-bold mb-2">Gira el teléfono</div>
    <div class="text-sm text-slate-400 mb-6">Para ver la gráfica a pantalla completa</div>
    <button onclick="enterFullscreen()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-semibold">
      Intentar pantalla completa
    </button>
  </div>
</div>

<!-- TOPBAR -->
<div id="topbar" class="ui-bar border-b">
  <div class="flex items-center gap-2 px-3 py-2">
    <button onclick="exitAndGoBack()" title="Salir de la gráfica"
      class="px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold border border-rose-500 shadow-lg flex items-center gap-1.5 active:scale-95 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span>Salir</span>
    </button>

    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-sky-400 truncate">Gráfica Live</span>
        <div id="status-badge" class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
          Verificando...
        </div>
      </div>
      <div id="time-range-label" class="text-[10px] text-slate-400 font-mono">--</div>
    </div>

    <div class="flex items-center gap-1">
      <button class="range-btn" data-hours="2" onclick="setHours(2)">2h</button>
      <button class="range-btn" data-hours="4" onclick="setHours(4)">4h</button>
      <button class="range-btn" data-hours="8" onclick="setHours(8)">8h</button>
      <button class="range-btn" data-hours="12" onclick="setHours(12)">12h</button>
      <button class="range-btn" data-hours="24" onclick="setHours(24)">24h</button>
    </div>
  </div>
  <div class="flex items-center justify-center gap-2 px-3 pb-2">
    <button id="btn-prev-nav" onclick="navigateWindow(-1)" title="Ventana anterior" class="range-btn nav-btn">‹</button>
    <button id="btn-live" onclick="goLive()" class="range-btn px-4">Actual</button>
    <button id="btn-next-nav" onclick="navigateWindow(1)" title="Ventana siguiente" class="range-btn nav-btn">›</button>
  </div>
  <div id="history-notice" class="hidden text-center text-[10px] text-amber-400 px-3 pb-1.5"></div>
</div>

<!-- GRÁFICA -->
<div id="chart-container">
  <canvas id="tempChart"></canvas>
</div>

<!-- BOTTOMBAR -->
<div id="bottombar" class="ui-bar border-t">
  <div class="flex items-center justify-between px-3 py-2 text-[11px] gap-2 flex-wrap">

    <div class="flex items-center gap-1.5 shrink-0">
      <svg id="bat-icon" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      <span id="bat-val" class="font-mono text-slate-300">--% · --.--V</span>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      <button id="toggle-s1" onclick="toggleSeries(0)" title="Mostrar Sonda 1"
        class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#38bdf8"></span>
        <span>S1</span>
      </button>

      <button id="toggle-s2" onclick="toggleSeries(1)" title="Mostrar Sonda 2"
        class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#f87171"></span>
        <span>S2</span>
      </button>

      <button id="toggle-dt" onclick="toggleSeries(2)" title="Mostrar ΔT"
        class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#fbbf24"></span>
        <span>ΔT</span>
      </button>
    </div>

    <div class="flex items-center gap-1 text-slate-300 min-w-0">
      <svg class="w-4 h-4 text-sky-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.42 9.428a16 16 0 0121.16 0"/>
      </svg>
      <span id="wifi-val" class="truncate max-w-[180px]">--</span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="resetZoom()" title="Reset zoom"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>

      <button onclick="toggleFullscreen()" title="Pantalla completa"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      </button>

      <button onclick="toggleEPaper()" title="Alto contraste"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </button>
    </div>

  </div>
</div>

<script>
  /* ============================================================
     CONFIGURACIÓN
     ============================================================ */

  const API_URL = "https://api-termometro.manuelaa1990.workers.dev";
  const POLL_INTERVAL_MS = 10000;
  const ESP_CONNECTED_MAX_AGE_MS = 35000;
  const GAP_MS = 5 * 60 * 1000;        // hueco sin datos > 5 min => se corta la línea
  const MAX_CHART_POINTS = 1500;       // por encima se promedian buckets
  const VALID_HOURS = [2, 4, 8, 12, 24];
  const WORKER_SUPPORTS_FROM_TO = false;
  const MAX_HOURS_BACK = 72;

  const params = new URLSearchParams(location.search);

  /* Prioridad: ?hours= de la URL (viene de la app principal) > último valor guardado > 4 */
  let selectedHours = parseInt(params.get("hours"));
  if (!VALID_HOURS.includes(selectedHours)) {
    selectedHours = parseInt(localStorage.getItem("graph-hours"));
    if (!VALID_HOURS.includes(selectedHours)) selectedHours = 4;
  }

  let isLive = params.get("live") !== "0";
  let windowEndTime = new Date();
  const endParam = parseInt(params.get("end"));
  if (!isLive && Number.isFinite(endParam)) windowEndTime = new Date(endParam);

  let rawData = [];
  let isPolling = false;
  let fetchSeq = 0;
  let lastSeenAt = null;
  let latestAbsolute = null;
  let userZoomed = false;
  let lastRenderedEnd = null;
  let isEPaper = localStorage.getItem("epaper-mode") === "true";
  /* Misma inversión de sondas que la app principal */
  const isInverted = localStorage.getItem("probes-inverted") === "true";

  // Estado de las series: [S1, S2, ΔT]
  let seriesState = [true, true, true];
  try {
    const saved = JSON.parse(localStorage.getItem("graph-series") || "[true,true,true]");
    if (Array.isArray(saved) && saved.length === 3 && saved.some(Boolean)) seriesState = saved.map(Boolean);
  } catch (_) {}

  /* ============================================================
     GRÁFICA
     ============================================================ */

  const SERIES_STYLE = {
    color: [
      { borderColor: "#38bdf8", backgroundColor: "rgba(56,189,248,.08)", borderDash: [], fill: true },
      { borderColor: "#f87171", backgroundColor: "rgba(248,113,113,.08)", borderDash: [], fill: true },
      { borderColor: "#fbbf24", backgroundColor: "rgba(251,191,36,.08)", borderDash: [], fill: false }
    ],
    epaper: [
      { borderColor: "#000", backgroundColor: "transparent", borderDash: [], fill: false },
      { borderColor: "#000", backgroundColor: "transparent", borderDash: [10, 6], fill: false },
      { borderColor: "#444", backgroundColor: "transparent", borderDash: [2, 5], fill: false }
    ]
  };

  function formatXTick(value, index) {
    const d = new Date(value);
    const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const dm = d.toLocaleDateString([], { day: "2-digit", month: "2-digit" });
    if (index === 0 || (d.getHours() === 0 && d.getMinutes() === 0)) return [hm, dm];
    return hm;
  }

  /* Marcas en horas "redondas" locales; el paso se adapta al zoom actual */
  function buildTimeTicks(scale) {
    const min = scale.min, max = scale.max;
    if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) return;
    const steps = [1, 2, 5, 10, 15, 30, 60, 120, 180, 360, 720].map(m => m * 60000);
    const span = max - min;
    const stepMs = steps.find(s => span / s <= 10) || steps[steps.length - 1];
    const off = new Date().getTimezoneOffset() * 60000;
    const ticks = [];
    for (let t = Math.ceil((min - off) / stepMs) * stepMs + off; t <= max; t += stepMs) {
      ticks.push({ value: t });
    }
    scale.ticks = ticks;
  }

  const ctx = document.getElementById("tempChart").getContext("2d");

  const tempChart = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [
        { label: "Sonda 1", data: [], borderWidth: 2.5, tension: 0.25, pointRadius: 0, pointHoverRadius: 6, ...SERIES_STYLE.color[0] },
        { label: "Sonda 2", data: [], borderWidth: 2.5, tension: 0.25, pointRadius: 0, pointHoverRadius: 6, ...SERIES_STYLE.color[1] },
        { label: "ΔT",      data: [], borderWidth: 2.5, tension: 0.25, pointRadius: 0, pointHoverRadius: 6, ...SERIES_STYLE.color[2] }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      layout: { padding: { top: 8, right: 16, bottom: 8, left: 8 } },
      scales: {
        x: {
          type: "linear",
          ticks: { color: "#94a3b8", font: { size: 12 }, autoSkip: false, maxRotation: 0, callback: formatXTick },
          grid: { color: "rgba(51, 65, 85, 0.5)" },
          afterBuildTicks: buildTimeTicks
        },
        y: {
          grace: "5%",
          ticks: { color: "#94a3b8", font: { size: 12 }, maxTicksLimit: 10 },
          grid: { color: "rgba(51, 65, 85, 0.5)" }
        }
      },
      plugins: {
        legend: {
          display: true,
          position: "top",
          onClick: () => {},   // el clic en la leyenda descuadraba el estado de los botones S1/S2/ΔT
          labels: {
            color: "#cbd5e1",
            font: { size: 13, weight: "600" },
            boxWidth: 20,
            boxHeight: 3,
            padding: 16,
            usePointStyle: false
          }
        },
        tooltip: {
          backgroundColor: "rgba(15,23,42,0.95)",
          borderColor: "#334155",
          borderWidth: 1,
          titleColor: "#e2e8f0",
          bodyColor: "#cbd5e1",
          padding: 10,
          titleFont: { size: 13 },
          bodyFont: { size: 13 },
          callbacks: {
            title: function (items) {
              if (!items.length) return "";
              return new Date(items[0].parsed.x).toLocaleString([], { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
            },
            label: function (context) {
              const v = context.parsed.y;
              if (v === null || v === undefined) return context.dataset.label + ": --";
              return context.dataset.label + ": " + v.toFixed(2) + " °C";
            }
          }
        },
        zoom: {
          limits: { x: { min: undefined, max: undefined } },   // se fijan en cada render con la ventana real
          pan: {
            enabled: true,
            mode: "x",
            threshold: 5,
            onPanComplete: onChartViewChanged
          },
          zoom: {
            wheel: { enabled: true, speed: 0.05 },
            pinch: { enabled: true },
            drag: { enabled: false },
            mode: "x",
            onZoomComplete: onChartViewChanged
          }
        }
      }
    }
  });

  /* ============================================================
     FETCH
     ============================================================ */

  function withTimeout(promise, ms) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error("TIMEOUT")), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }

  async function fetchJSON(path) {
    const res = await withTimeout(fetch(API_URL + path), 10000);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function fetchRange(hours) {
    const data = await fetchJSON(`/range?hours=${hours}`);
    return Array.isArray(data) ? data : [];
  }

  async function fetchLatest() {
    return fetchJSON("/latest");
  }

  function hoursBackFor(startMs) {
    return Math.ceil((Date.now() - startMs) / 3600000) + 1;
  }

  async function fetchWindow(startMs, endMs) {
    if (WORKER_SUPPORTS_FROM_TO) {
      const from = encodeURIComponent(new Date(startMs).toISOString());
      const to = encodeURIComponent(new Date(endMs).toISOString());
      const data = await fetchJSON(`/range?from=${from}&to=${to}`);
      return Array.isArray(data) ? data : [];
    }
    const hoursBack = hoursBackFor(startMs);
    if (hoursBack > MAX_HOURS_BACK) throw new Error("LIMIT");
    return fetchRange(hoursBack);
  }

  function getWindow() {
    const end = isLive ? Date.now() : windowEndTime.getTime();
    return { start: end - selectedHours * 3600000, end };
  }

  function setNotice(text) {
    const el = document.getElementById("history-notice");
    if (!el) return;
    el.textContent = text || "";
    el.classList.toggle("hidden", !text);
  }

  function updateNavUI() {
    const liveBtn = document.getElementById("btn-live");
    if (liveBtn) liveBtn.classList.toggle("active", isLive);

    const nextBtn = document.getElementById("btn-next-nav");
    if (nextBtn) {
      const atPresent = isLive || windowEndTime.getTime() >= Date.now() - 5000;
      nextBtn.disabled = atPresent;
      nextBtn.title = atPresent ? "Ya estás en el presente" : `Adelante ${selectedHours} h`;
    }

    const prevBtn = document.getElementById("btn-prev-nav");
    if (prevBtn) prevBtn.title = `Atrás ${selectedHours} h`;
  }

  function onChartViewChanged() {
    const scale = tempChart.scales.x;
    if (!scale || !Number.isFinite(scale.min) || !Number.isFinite(scale.max)) {
      userZoomed = true;
      return;
    }

    const { end } = getWindow();
    const nearPresent = scale.max >= end - 15000;

    if (isLive && nearPresent) {
      userZoomed = scale.max - scale.min < (selectedHours * 3600000) * 0.92;
      return;
    }

    userZoomed = true;
    if (isLive && !nearPresent) {
      isLive = false;
      windowEndTime = new Date(scale.max);
      updateNavUI();
      updateTimeRangeLabel();
    }
  }

  /* ============================================================
     PROCESAR FILAS
     ============================================================ */

  function toNum(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  /* Descarta valores imposibles del DS18B20 (-127 = desconectado) */
  function cleanTemp(v) {
    const n = toNum(v);
    return (n !== null && n > -50 && n <= 125) ? n : null;
  }

  /* Misma curva que la app principal, para que ambas pantallas muestren el mismo % */
  const BATTERY_CURVE = [
    [4.20, 100], [4.06, 90], [3.98, 80], [3.92, 70],
    [3.87, 60],  [3.82, 50], [3.79, 40], [3.77, 30],
    [3.74, 20],  [3.68, 10], [3.45, 5],  [3.00, 0]
  ];

  function voltageToPercent(v) {
    if (!Number.isFinite(v)) return null;
    if (v >= BATTERY_CURVE[0][0]) return 100;
    if (v <= BATTERY_CURVE[BATTERY_CURVE.length - 1][0]) return 0;
    for (let i = 0; i < BATTERY_CURVE.length - 1; i++) {
      const [vHigh, pHigh] = BATTERY_CURVE[i];
      const [vLow, pLow] = BATTERY_CURVE[i + 1];
      if (v <= vHigh && v >= vLow) {
        return Math.round(pLow + ((v - vLow) / (vHigh - vLow)) * (pHigh - pLow));
      }
    }
    return 0;
  }

  function processRow(row) {
    if (!row) return null;
    const raw1 = cleanTemp(row.temp1);
    const raw2 = cleanTemp(row.temp2);
    const s1 = isInverted ? raw2 : raw1;
    const s2 = isInverted ? raw1 : raw2;
    const delta = (s1 !== null && s2 !== null) ? Math.abs(s1 - s2) : null;

    const vBat = toNum(row.bateriaVolt);
    const bateria = vBat !== null ? voltageToPercent(vBat) : null;

    return {
      ...row,
      s1, s2, delta,
      bateria,
      bateriaVolt: vBat,
      wifi: row.wifi || row.ssid || null,
      ip: row.ip_local || row.ip || null
    };
  }

  function formatAge(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return `${s} s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} h ${m % 60} min`;
    return `${Math.floor(h / 24)} d`;
  }

  /* Promedia buckets si hay demasiados puntos */
  function downsample(pts, maxPts) {
    if (pts.length <= maxPts) return pts;
    const k = Math.ceil(pts.length / maxPts);
    const out = [];
    for (let i = 0; i < pts.length; i += k) {
      const g = pts.slice(i, i + k);
      const avg = key => {
        const v = g.map(p => p[key]).filter(x => x !== null);
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      };
      out.push({
        t: g.reduce((a, p) => a + p.t, 0) / g.length,
        s1: avg("s1"), s2: avg("s2"), delta: avg("delta")
      });
    }
    return out;
  }

  /* ============================================================
     RENDER
     ============================================================ */

  function renderChart() {
    const end = Date.now();
    const start = end - selectedHours * 3600000;

    const processed = rawData.map(processRow).filter(Boolean);
    const allPts = processed.map(r => ({ t: new Date(r.created_at).getTime(), s1: r.s1, s2: r.s2, delta: r.delta }));
    const pts = downsample(allPts, MAX_CHART_POINTS);

    const d1 = [], d2 = [], dd = [];
    let prevT = null;
    pts.forEach(p => {
      if (prevT !== null && p.t - prevT > GAP_MS) {
        const g = (p.t + prevT) / 2;
        d1.push({ x: g, y: null });
        d2.push({ x: g, y: null });
        dd.push({ x: g, y: null });
      }
      d1.push({ x: p.t, y: p.s1 });
      d2.push({ x: p.t, y: p.s2 });
      dd.push({ x: p.t, y: p.delta });
      prevT = p.t;
    });

    tempChart.data.datasets[0].data = d1;
    tempChart.data.datasets[1].data = d2;
    tempChart.data.datasets[2].data = dd;

    /* Auto-escalado del eje Y con las series VISIBLES */
    let tMin = Infinity, tMax = -Infinity;
    allPts.forEach(p => {
      [[0, p.s1], [1, p.s2], [2, p.delta]].forEach(([i, v]) => {
        if (seriesState[i] && v !== null) {
          if (v < tMin) tMin = v;
          if (v > tMax) tMax = v;
        }
      });
    });

    if (tMin !== Infinity) {
      const margin = Math.max(1, (tMax - tMin) * 0.15);
      tempChart.options.scales.y.min = Math.floor((tMin - margin) / 2) * 2;
      tempChart.options.scales.y.max = Math.ceil((tMax + margin) / 2) * 2;
    } else {
      tempChart.options.scales.y.min = undefined;
      tempChart.options.scales.y.max = undefined;
    }

    /* Ventana en vivo: solo se desliza si el usuario no ha hecho zoom/pan */
    tempChart.options.plugins.zoom.limits.x = { min: start, max: end };
    if (!userZoomed) {
      tempChart.options.scales.x.min = start;
      tempChart.options.scales.x.max = end;
    }

    tempChart.update("none");
    updateTimeRangeLabel();
  }

  function renderStatusBar() {
    if (!latestAbsolute) return;

    const bat = latestAbsolute;
    if (bat.bateriaVolt !== null && bat.bateria !== null) {
      document.getElementById("bat-val").textContent = `${bat.bateria}% · ${bat.bateriaVolt.toFixed(2)}V`;

      const icon = document.getElementById("bat-icon");
      const cls = bat.bateria <= 20 || bat.bateriaVolt <= 3.10 ? "text-rose-500"
                : bat.bateria <= 50 ? "text-amber-400"
                : "text-emerald-400";
      icon.setAttribute("class", "w-4 h-4 " + cls);
    }

    const wifi = bat.wifi || "?";
    const ip = bat.ip ? ` · ${bat.ip}` : "";
    document.getElementById("wifi-val").textContent = `${wifi}${ip}`;
  }

  function updateTimeRangeLabel() {
    const now = new Date();
    const start = new Date(now.getTime() - selectedHours * 3600 * 1000);
    const opts = { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" };
    document.getElementById("time-range-label").textContent =
      `${start.toLocaleString([], opts)} → ${now.toLocaleString([], opts)} · ${selectedHours}h · ${rawData.length} pts`;
  }

  function updateStatusBadge() {
    const badge = document.getElementById("status-badge");
    if (!badge) return;

    const age = lastSeenAt ? Date.now() - lastSeenAt.getTime() : null;
    let text, style;

    if (age !== null && age <= ESP_CONNECTED_MAX_AGE_MS) {
      text = "En vivo · " + formatAge(age);
      style = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
    } else if (age !== null) {
      text = "Desconectado · " + formatAge(age);
      style = "bg-rose-500/20 text-rose-400 border-rose-500/30";
    } else {
      text = "Sin datos";
      style = "bg-amber-500/20 text-amber-400 border-amber-500/30";
    }

    badge.textContent = text;
    badge.className = "px-2 py-0.5 text-[10px] font-semibold rounded-full border " + style;
  }

  /* ============================================================
     FETCH LOOP
     ============================================================ */

  function noteSeen(createdAt) {
    const t = new Date(createdAt).getTime();
    if (Number.isFinite(t) && (!lastSeenAt || t > lastSeenAt.getTime())) lastSeenAt = new Date(t);
  }

  async function refreshRange() {
    const mySeq = ++fetchSeq;      // si cambias de rango mientras carga, gana la petición más nueva
    const hours = selectedHours;
    try {
      const data = await fetchRange(hours);
      if (mySeq !== fetchSeq) return;

      const end = Date.now();
      const start = end - hours * 3600000;
      rawData = data
        .filter(r => {
          const t = new Date(r.created_at).getTime();
          return Number.isFinite(t) && t >= start && t <= end + 60000;
        })
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      if (rawData.length) noteSeen(rawData[rawData.length - 1].created_at);
      renderChart();
    } catch (err) {
      if (mySeq !== fetchSeq) return;
      console.error("Error rango:", err);
    } finally {
      if (mySeq === fetchSeq) updateStatusBadge();
    }
  }

  /* Añade la lectura nueva a la gráfica sin esperar al refresco de 30 s */
  function mergeLiveRow(row) {
    const t = new Date(row.created_at).getTime();
    if (!Number.isFinite(t)) return;
    const end = Date.now();
    const start = end - selectedHours * 3600000;
    if (t < start || t > end + 60000) return;

    const lastT = rawData.length ? new Date(rawData[rawData.length - 1].created_at).getTime() : -Infinity;
    if (t <= lastT) return;

    rawData = rawData.filter(r => new Date(r.created_at).getTime() >= start);
    rawData.push(row);
    renderChart();
  }

  async function refreshLatest() {
    if (isPolling || document.hidden) return;
    isPolling = true;
    try {
      const row = await fetchLatest();
      if (row && row.created_at) {
        noteSeen(row.created_at);
        latestAbsolute = processRow(row);
        renderStatusBar();
        mergeLiveRow(row);
      }
    } catch (err) {
      console.error("Error latest:", err);
    } finally {
      isPolling = false;
      updateStatusBadge();
    }
  }

  /* ============================================================
     SELECTOR DE SERIES
     ============================================================ */

  function applySeriesVisibility() {
    seriesState.forEach((visible, i) => tempChart.setDatasetVisibility(i, visible));

    ["toggle-s1", "toggle-s2", "toggle-dt"].forEach((id, i) => {
      const btn = document.getElementById(id);
      if (btn) btn.classList.toggle("active", seriesState[i]);
    });

    localStorage.setItem("graph-series", JSON.stringify(seriesState));
    renderChart();   // recalcula el eje Y según las series visibles
  }

  function toggleSeries(index) {
    if (index < 0 || index > 2) return;

    const newState = [...seriesState];
    newState[index] = !newState[index];
    if (!newState.some(v => v)) return;   // nunca dejar todas ocultas

    seriesState = newState;
    if ("vibrate" in navigator) navigator.vibrate(15);
    applySeriesVisibility();
  }

  /* ============================================================
     CONTROLES DE UI
     ============================================================ */

  function setHours(h) {
    selectedHours = h;
    localStorage.setItem("graph-hours", h);
    document.querySelectorAll(".range-btn").forEach(b => {
      b.classList.toggle("active", parseInt(b.dataset.hours) === h);
    });
    resetZoom(true);
    refreshRange();
  }

  function resetZoom(silent) {
    if (tempChart.resetZoom) tempChart.resetZoom();
    userZoomed = false;
    renderChart();
    if (silent !== true && "vibrate" in navigator) navigator.vibrate(15);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) enterFullscreen();
    else document.exitFullscreen();
  }

  async function enterFullscreen() {
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (_) {}

      document.getElementById("portrait-hint").classList.add("hidden");
    } catch (err) {
      console.warn("Fullscreen no disponible:", err);
    }
  }

  function toggleEPaper() {
    isEPaper = !isEPaper;
    localStorage.setItem("epaper-mode", isEPaper ? "true" : "false");
    applyEPaper();
  }

  function applyEPaper() {
    document.body.classList.toggle("epaper-mode", isEPaper);

    SERIES_STYLE[isEPaper ? "epaper" : "color"].forEach((st, i) => Object.assign(tempChart.data.datasets[i], st));

    const sc = tempChart.options.scales;
    const legend = tempChart.options.plugins.legend.labels;
    if (isEPaper) {
      sc.x.ticks.color = "#000";  sc.x.grid.color = "#cbd5e1";
      sc.y.ticks.color = "#000";  sc.y.grid.color = "#cbd5e1";
      legend.color = "#000";
    } else {
      sc.x.ticks.color = "#94a3b8";  sc.x.grid.color = "rgba(51, 65, 85, 0.5)";
      sc.y.ticks.color = "#94a3b8";  sc.y.grid.color = "rgba(51, 65, 85, 0.5)";
      legend.color = "#cbd5e1";
    }
    tempChart.update("none");
  }

  async function exitAndGoBack() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (_) {}
      }
    } catch (_) {}

    location.replace("./index.html");
  }

  /* Doble tap para mostrar/ocultar UI */
  let lastTap = 0;
  document.getElementById("chart-container").addEventListener("touchend", (e) => {
    if (e.touches.length > 0) return;       // ignora el final de un gesto de pinch
    const now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
      document.getElementById("topbar").classList.toggle("hidden-ui");
      document.getElementById("bottombar").classList.toggle("hidden-ui");
    }
    lastTap = now;
  }, { passive: false });

  /* ============================================================
     BOTÓN FÍSICO "ATRÁS" DEL MÓVIL
     ============================================================ */

  history.pushState({ page: "grafica" }, "", location.href);
  window.addEventListener("popstate", () => { exitAndGoBack(); });

  /* ============================================================
     INICIALIZACIÓN
     ============================================================ */

  window.addEventListener("DOMContentLoaded", async () => {
    document.querySelectorAll(".range-btn").forEach(b => {
      b.classList.toggle("active", parseInt(b.dataset.hours) === selectedHours);
    });

    applyEPaper();
    applySeriesVisibility();

    if (window.matchMedia("(orientation: portrait)").matches && window.innerWidth < 1024) {
      document.getElementById("portrait-hint").classList.add("force-hint");
    }

    window.matchMedia("(orientation: portrait)").addEventListener("change", (e) => {
      const hint = document.getElementById("portrait-hint");
      if (e.matches && window.innerWidth < 1024) hint.classList.add("force-hint");
      else hint.classList.remove("force-hint");
    });

    await refreshRange();
    await refreshLatest();

    setInterval(refreshRange, 30000);
    setInterval(refreshLatest, POLL_INTERVAL_MS);
    setInterval(updateStatusBadge, 2000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        refreshRange();
        refreshLatest();
      }
    });
  });
</script>

</body>
</html>
