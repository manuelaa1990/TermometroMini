<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gráfica Live · Termómetro</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
  <!-- Plugin para las etiquetas flotantes tipo burbuja -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    #chart-container { position: absolute; inset: 0; touch-action: none; }
    #topbar, #bottombar {
      position: absolute; left: 0; right: 0; z-index: 20;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #topbar { top: 0; } #bottombar { bottom: 0; }
    #topbar.hidden-ui { opacity: 0; transform: translateY(-100%); pointer-events: none; }
    #bottombar.hidden-ui { opacity: 0; transform: translateY(100%); pointer-events: none; }

    #portrait-hint {
      position: absolute; inset: 0; display: none; align-items: center;
      justify-content: center; background: #0f172a; z-index: 100;
      text-align: center; padding: 2rem;
    }
    @media (orientation: portrait) and (max-width: 1023px) {
      #portrait-hint.force-hint { display: flex; }
    }
    #portrait-hint.hidden { display: none !important; }
    .rotate-icon { animation: rotate 2s ease-in-out infinite; display: inline-block; }
    @keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

    .range-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      color: #94a3b8; background: transparent; border: 1px solid #334155;
      transition: all 0.15s; cursor: pointer;
    }
    .range-btn.active { background: #0284c7; color: white; border-color: #0284c7; }

    .ui-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-color: rgba(51, 65, 85, 0.6);
    }
    .series-toggle {
      border-color: #334155; background: #1e293b; color: #94a3b8; opacity: 0.45;
    }
    .series-toggle.active {
      opacity: 1; color: #e2e8f0; background: #334155; border-color: #475569;
    }
    /* Estilo para el indicador de historial */
    .history-badge {
      background: #7c3aed; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold;
    }
  </style>
</head>

<body>

<div id="portrait-hint">
  <div>
    <div class="rotate-icon text-6xl mb-4">📱</div>
    <div class="text-xl font-bold mb-2">Gira el teléfono</div>
    <div class="text-sm text-slate-400 mb-6">Para ver la gráfica a pantalla completa</div>
    <button onclick="enterFullscreen()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-semibold">
      Intentar pantalla completa
    </button>
  </div>
</div>

<div id="topbar" class="ui-bar border-b">
  <div class="flex items-center gap-2 px-3 py-2">
    <button onclick="exitAndGoBack()"
      class="px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold border border-rose-500 shadow-lg flex items-center gap-1.5 active:scale-95 transition shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span>Salir</span>
    </button>

    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-sky-400 truncate">Gráfica Live</span>
        <div id="status-badge" class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 truncate">
          Verificando...
        </div>
        <!-- Nuevo indicador de historial -->
        <div id="history-indicator" class="history-badge hidden">Historial</div>
      </div>
      <!-- Aquí se muestra el rango de fechas -->
      <div id="time-range-label" class="text-[10px] text-slate-400 font-mono truncate">--</div>
    </div>

    <div class="flex items-center gap-1 shrink-0 overflow-x-auto">
      <button class="range-btn flex items-center justify-center w-8 h-7" onclick="navigateHistory(1)" title="Más antiguo">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="btn-actual" class="range-btn bg-sky-600 text-white border-sky-600 hidden h-7" onclick="navigateHistory(0, true)">Live</button>
      <button id="btn-forward" class="range-btn flex items-center justify-center w-8 h-7 hidden" onclick="navigateHistory(-1)" title="Más reciente">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="w-px h-4 bg-slate-700 mx-1"></div>
      <button class="range-btn" data-hours="2" onclick="setHours(2)">2h</button>
      <button class="range-btn" data-hours="4" onclick="setHours(4)">4h</button>
      <button class="range-btn" data-hours="8" onclick="setHours(8)">8h</button>
      <button class="range-btn" data-hours="12" onclick="setHours(12)">12h</button>
      <button class="range-btn" data-hours="24" onclick="setHours(24)">24h</button>
    </div>
  </div>
</div>

<div id="chart-container">
  <canvas id="tempChart"></canvas>
</div>

<div id="bottombar" class="ui-bar border-t">
  <div class="flex items-center justify-between px-3 py-2 text-[11px] gap-2 flex-wrap">
    <div class="flex items-center gap-1.5 shrink-0">
      <svg id="bat-icon" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      <span id="bat-val" class="font-mono text-slate-300">--% · --.--V</span>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      <button id="toggle-s1" onclick="toggleSeries(0)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#eab308"></span><span>S1</span>
      </button>
      <button id="toggle-s2" onclick="toggleSeries(1)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#a855f7"></span><span>S2</span>
      </button>
      <button id="toggle-dt" onclick="toggleSeries(2)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#fbbf24"></span><span>ΔT</span>
      </button>
    </div>

    <div class="flex items-center gap-1 text-slate-300 min-w-0">
      <svg class="w-4 h-4 text-sky-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.42 9.428a16 16 0 0121.16 0"/>
      </svg>
      <span id="wifi-val" class="truncate max-w-[180px]">--</span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="resetZoom()" title="Reset zoom"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button onclick="toggleFullscreen()" title="Pantalla completa"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     CONFIG
     ============================================================ */
  const API_URL = "https://api-termometro.manuelaa1990.workers.dev";
  const POLL_MS = 10000;
  const MAX_AGE_MS = 35000;
  const GAP_MS = 2 * 60 * 1000;
  const MAX_HISTORY_HOURS = 168;

  /* ============================================================
     ESTADO
     ============================================================ */
  let selectedHours = 4;
  let offsetHours = 0;
  let allData = [];
  let latestRow = null;
  let lastSeenAt = null;
  let isRefreshing = false;
  let userZoomed = false;
  let seriesState = JSON.parse(localStorage.getItem("graph-series") || "[true,true,true]");
  if (!Array.isArray(seriesState) || seriesState.length !== 3) seriesState = [true,true,true];

  /* ============================================================
     UTILS
     ============================================================ */
  function parseTs(s) {
    if (!s) return null;
    let str = String(s).trim();
    if (str.includes(" ")) str = str.replace(" ", "T");
    if (!str.endsWith("Z") && !str.includes("+") && !str.includes("-", 10)) str += "Z";
    const t = new Date(str).getTime();
    return isNaN(t) ? null : t;
  }

  function processRow(row) {
    if (!row) return null;
    const t1 = (row.temp1 === null || row.temp1 < -50 || row.temp1 > 125) ? null : Number(row.temp1);
    const t2 = (row.temp2 === null || row.temp2 < -50 || row.temp2 > 125) ? null : Number(row.temp2);
    const dt = (t1 !== null && t2 !== null) ? Math.abs(t1 - t2) : null;
    const vBat = Number(row.bateriaVolt);
    const bat = Number.isFinite(vBat) && vBat > 0.5 ? vBat : null;
    const pct = bat !== null ? Math.max(0, Math.min(100, Math.round(((bat - 3.10) / (4.20 - 3.10)) * 100))) : null;
    return {
      ...row, s1: t1, s2: t2, delta: dt,
      bateria: pct, bateriaVolt: bat,
      wifi: row.wifi || row.ssid || null,
      ip: row.ip_local || row.ip || null
    };
  }

  function withTimeout(p, ms) {
    let timer;
    const t = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("TIMEOUT")), ms); });
    return Promise.race([p, t]).finally(() => clearTimeout(timer));
  }

  async function fetchJSON(path) {
    const res = await withTimeout(fetch(API_URL + path), 12000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function fetchRange(hours, offset = 0) {
    const q = offset > 0 ? `/range?hours=${hours}&offset=${offset}` : `/range?hours=${hours}`;
    const data = await fetchJSON(q);
    return Array.isArray(data) ? data : [];
  }

  /* ============================================================
     CARGA INICIAL
     ============================================================ */
  async function loadAllHistory() {
    const chunks = [];
    let gotBig = false;

    try {
      const big = await fetchRange(MAX_HISTORY_HOURS);
      if (big.length >
