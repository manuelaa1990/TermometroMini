<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gráfica Live · Termómetro</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    #chart-container { position: absolute; inset: 0; touch-action: none; }
    #topbar, #bottombar {
      position: absolute; left: 0; right: 0; z-index: 20;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #topbar { top: 0; } #bottombar { bottom: 0; }
    #topbar.hidden-ui { opacity: 0; transform: translateY(-100%); pointer-events: none; }
    #bottombar.hidden-ui { opacity: 0; transform: translateY(100%); pointer-events: none; }

    #portrait-hint {
      position: absolute; inset: 0; display: none; align-items: center;
      justify-content: center; background: #0f172a; z-index: 100;
      text-align: center; padding: 2rem;
    }
    @media (orientation: portrait) and (max-width: 1023px) {
      #portrait-hint.force-hint { display: flex; }
    }
    #portrait-hint.hidden { display: none !important; }
    .rotate-icon { animation: rotate 2s ease-in-out infinite; display: inline-block; }
    @keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

    .range-btn {
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
      color: #94a3b8; background: transparent; border: 1px solid #334155;
      transition: all 0.15s; cursor: pointer;
    }
    .range-btn.active { background: #0284c7; color: white; border-color: #0284c7; }

    .ui-bar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-color: rgba(51, 65, 85, 0.6);
    }
    .series-toggle {
      border-color: #334155; background: #1e293b; color: #94a3b8; opacity: 0.45;
    }
    .series-toggle.active {
      opacity: 1; color: #e2e8f0; background: #334155; border-color: #475569;
    }
    .history-badge {
      background: #7c3aed; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold;
    }
  </style>
</head>

<body>

<div id="portrait-hint">
  <div>
    <div class="rotate-icon text-6xl mb-4">📱</div>
    <div class="text-xl font-bold mb-2">Gira el teléfono</div>
    <div class="text-sm text-slate-400 mb-6">Para ver la gráfica a pantalla completa</div>
    <button onclick="enterFullscreen()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-semibold">
      Intentar pantalla completa
    </button>
  </div>
</div>

<div id="topbar" class="ui-bar border-b">
  <div class="flex items-center gap-2 px-3 py-2">
    <button onclick="exitAndGoBack()"
      class="px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold border border-rose-500 shadow-lg flex items-center gap-1.5 active:scale-95 transition shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      <span>Salir</span>
    </button>

    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2">
        <span class="text-sm font-bold text-sky-400 truncate">Gráfica Live</span>
        <div id="status-badge" class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 truncate">
          Verificando...
        </div>
        <div id="history-indicator" class="history-badge hidden">Historial</div>
      </div>
      <div id="time-range-label" class="text-[10px] text-slate-400 font-mono truncate">--</div>
    </div>

    <div class="flex items-center gap-1 shrink-0 overflow-x-auto">
      <button class="range-btn flex items-center justify-center w-8 h-7" onclick="navigateHistory(1)" title="Más antiguo">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="btn-actual" class="range-btn bg-sky-600 text-white border-sky-600 hidden h-7" onclick="navigateHistory(0, true)">Live</button>
      <button id="btn-forward" class="range-btn flex items-center justify-center w-8 h-7 hidden" onclick="navigateHistory(-1)" title="Más reciente">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="w-px h-4 bg-slate-700 mx-1"></div>
      <button class="range-btn" data-hours="2" onclick="setHours(2)">2h</button>
      <button class="range-btn" data-hours="4" onclick="setHours(4)">4h</button>
      <button class="range-btn" data-hours="8" onclick="setHours(8)">8h</button>
      <button class="range-btn" data-hours="12" onclick="setHours(12)">12h</button>
      <button class="range-btn" data-hours="24" onclick="setHours(24)">24h</button>
    </div>
  </div>
</div>

<div id="chart-container">
  <canvas id="tempChart"></canvas>
</div>

<div id="bottombar" class="ui-bar border-t">
  <div class="flex items-center justify-between px-3 py-2 text-[11px] gap-2 flex-wrap">
    <div class="flex items-center gap-1.5 shrink-0">
      <svg id="bat-icon" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
      <span id="bat-val" class="font-mono text-slate-300">--% · --.--V</span>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      <button id="toggle-s1" onclick="toggleSeries(0)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#eab308"></span><span>S1</span>
      </button>
      <button id="toggle-s2" onclick="toggleSeries(1)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#a855f7"></span><span>S2</span>
      </button>
      <button id="toggle-dt" onclick="toggleSeries(2)" class="series-toggle active flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold transition active:scale-95 border">
        <span class="w-2 h-2 rounded-full" style="background:#ef4444"></span><span>ΔT</span>
      </button>
    </div>

    <div class="flex items-center gap-1 text-slate-300 min-w-0">
      <svg class="w-4 h-4 text-sky-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071a10 10 0 0114.142 0M1.42 9.428a16 16 0 0121.16 0"/>
      </svg>
      <span id="wifi-val" class="truncate max-w-[180px]">--</span>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="resetZoom()" title="Reset zoom"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button onclick="toggleFullscreen()" title="Pantalla completa"
        class="p-1.5 rounded bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     CONFIG
     ============================================================ */
  const API_URL = "https://api-termometro.manuelaa1990.workers.dev";
  const POLL_MS = 10000;
  const MAX_AGE_MS = 35000;
  const GAP_MS = 2 * 60 * 1000;
  const MAX_HISTORY_HOURS = 168;

  /* ============================================================
     ESTADO
     ============================================================ */
  let selectedHours = 4;
  let offsetHours = 0;
  let allData = [];
  let latestRow = null;
  let lastSeenAt = null;
  let isRefreshing = false;
  let userZoomed = false;
  let seriesState = JSON.parse(localStorage.getItem("graph-series") || "[true,true,true]");
  if (!Array.isArray(seriesState) || seriesState.length !== 3) seriesState = [true,true,true];

  /* ============================================================
     UTILS
     ============================================================ */
  function parseTs(s) {
    if (!s) return null;
    let str = String(s).trim();
    if (str.includes(" ")) str = str.replace(" ", "T");
    if (!str.endsWith("Z") && !str.includes("+") && !str.includes("-", 10)) str += "Z";
    const t = new Date(str).getTime();
    return isNaN(t) ? null : t;
  }

  function processRow(row) {
    if (!row) return null;
    const t1 = (row.temp1 === null || row.temp1 < -50 || row.temp1 > 125) ? null : Number(row.temp1);
    const t2 = (row.temp2 === null || row.temp2 < -50 || row.temp2 > 125) ? null : Number(row.temp2);
    const dt = (t1 !== null && t2 !== null) ? Math.abs(t1 - t2) : null;
    const vBat = Number(row.bateriaVolt);
    const bat = Number.isFinite(vBat) && vBat > 0.5 ? vBat : null;
    const pct = bat !== null ? Math.max(0, Math.min(100, Math.round(((bat - 3.10) / (4.20 - 3.10)) * 100))) : null;
    return {
      ...row, s1: t1, s2: t2, delta: dt,
      bateria: pct, bateriaVolt: bat,
      wifi: row.wifi || row.ssid || null,
      ip: row.ip_local || row.ip || null
    };
  }

  function withTimeout(p, ms) {
    let timer;
    const t = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("TIMEOUT")), ms); });
    return Promise.race([p, t]).finally(() => clearTimeout(timer));
  }

  async function fetchJSON(path) {
    const res = await withTimeout(fetch(API_URL + path), 12000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function fetchRange(hours, offset = 0) {
    const q = offset > 0 ? `/range?hours=${hours}&offset=${offset}` : `/range?hours=${hours}`;
    const data = await fetchJSON(q);
    return Array.isArray(data) ? data : [];
  }

  /* ============================================================
     CARGA INICIAL
     ============================================================ */
  async function loadAllHistory() {
    const chunks = [];
    let gotBig = false;

    try {
      const big = await fetchRange(MAX_HISTORY_HOURS);
      if (big.length > 1) {
        const t0 = parseTs(big[0].created_at);
        const t1 = parseTs(big[big.length - 1].created_at);
        const span = (t1 - t0) / 3600000;
        if (span >= 12) { chunks.push(big); gotBig = true; }
      }
    } catch (e) { console.warn("Fallo carga 7d:", e); }

    if (!gotBig) {
      let prevFirst = null;
      for (let i = 0; i < 8; i++) {
        try {
          const chunk = await fetchRange(24, i * 24);
          if (!chunk.length) break;
          const firstTs = parseTs(chunk[0].created_at);
          if (prevFirst !== null && Math.abs(firstTs - prevFirst) < 60000) break;
          prevFirst = firstTs;
          chunks.push(chunk);
        } catch (e) { break; }
      }
    }

    const seen = new Set();
    const merged = [];
    for (const chunk of chunks) {
      for (const row of chunk) {
        const key = row.created_at;
        if (key && !seen.has(key)) { seen.add(key); merged.push(row); }
      }
    }
    merged.sort((a, b) => (parseTs(a.created_at) || 0) - (parseTs(b.created_at) || 0));
    allData = merged;

    if (allData.length === 0) {
      console.warn("⚠️ API sin datos. Generando Mock Data...");
      const now = Date.now();
      for (let i = 0; i < 60; i++) {
        const t = now - (60 - i) * 5 * 60000;
        allData.push({
          created_at: new Date(t).toISOString(),
          temp1: 25 + Math.sin(i / 5) * 6 + Math.random(),
          temp2: 28 + Math.cos(i / 5) * 4 + Math.random(),
          bateriaVolt: 3.8 + Math.random() * 0.3,
          wifi: "Mock WiFi",
          ip: "192.168.1.100"
        });
      }
      document.getElementById("status-badge").textContent = "⚠️ Modo Prueba";
      document.getElementById("status-badge").className = "px-2 py-0.5 text-[10px] font-semibold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 truncate";
    }
  }

  function getSlice() {
    if (!allData.length) return [];
    const now = Date.now();
    const endTime = now - offsetHours * 3600 * 1000;
    const startTime = endTime - selectedHours * 3600 * 1000;
    return allData.filter(r => {
      const t = parseTs(r.created_at);
      return t && t >= startTime && t <= endTime;
    });
  }

  /* ============================================================
     GRÁFICA
     ============================================================ */
  const ctx = document.getElementById("tempChart").getContext("2d");
  const tempChart = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [
        { 
          label: "Sonda 2", 
          borderColor: "#a855f7", 
          backgroundColor: (context) => {
            const ctx = context.chart.ctx;
            const chartArea = context.chart.chartArea;
            if (!chartArea) return null;
            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
            gradient.addColorStop(0, 'rgba(168, 85, 247, 0)');
            gradient.addColorStop(1, 'rgba(168, 85, 247, 0.45)');
            return gradient;
          },
          data: [], borderWidth: 3, tension: 0.5, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: "#ffffff", pointBorderColor: "#a855f7", pointBorderWidth: 2, fill: true, spanGaps: false 
        },
        { 
          label: "Sonda 1", 
          borderColor: "#eab308", 
          backgroundColor: (context) => {
            const ctx = context.chart.ctx;
            const chartArea = context.chart.chartArea;
            if (!chartArea) return null;
            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
            gradient.addColorStop(0, 'rgba(234, 179, 8, 0)');
            gradient.addColorStop(1, 'rgba(234, 179, 8, 0.45)');
            return gradient;
          },
          data: [], borderWidth: 3, tension: 0.5, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: "#ffffff", pointBorderColor: "#eab308", pointBorderWidth: 2, fill: true, spanGaps: false 
        },
        { 
          label: "ΔT", 
          borderColor: "#ef4444", 
          backgroundColor: (context) => {
            const ctx = context.chart.ctx;
            const chartArea = context.chart.chartArea;
            if (!chartArea) return null;
            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
            gradient.addColorStop(0, 'rgba(239, 68, 68, 0)');
            gradient.addColorStop(1, 'rgba(239, 68, 68, 0.45)');
            return gradient;
          },
          data: [], borderWidth: 3, tension: 0.5, pointRadius: 0, pointHoverRadius: 6, pointBackgroundColor: "#ffffff", pointBorderColor: "#ef4444", pointBorderWidth: 2, fill: true, spanGaps: false 
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      // 🔥 AUMENTAMOS EL PADDING PARA CREAR UNA ZONA DE SEGURIDAD ALREDEDOR
      layout: { padding: { top: 60, right: 60, bottom: 40, left: 60 } },
      scales: {
        x: {
          type: "time",
          time: { unit: "hour", tooltipFormat: "dd/MM/yyyy, HH:mm",
            displayFormats: { minute: "HH:mm", hour: "HH:mm", day: "dd/MM" } },
          ticks: { color: "#64748b", font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 },
          grid: { display: false, drawBorder: false },
          border: { display: false }
        },
        y: {
          // 🔥 AUMENTAMOS EL GRACE PARA DAR MÁS ESPACIO VERTICAL A LAS BURBUJAS
          grace: "30%", 
          ticks: { color: "#64748b", font: { size: 11 }, stepSize: 2, padding: 8 },
          grid: { color: "rgba(51, 65, 85, 0.15)", drawBorder: false },
          border: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "rgba(15,23,42,0.95)", borderColor: "#334155", borderWidth: 1,
          titleColor: "#e2e8f0", bodyColor: "#cbd5e1", padding: 10,
          callbacks: {
            label: c => {
              const v = c.parsed.y;
              if (v === null || v === undefined || isNaN(v)) return c.dataset.label + ": --";
              return c.dataset.label + ": " + v.toFixed(2) + " °C";
            }
          }
        },
        annotation: { annotations: {} },
        zoom: {
          limits: { x: { min: "original", max: "original" } },
          pan: { enabled: true, mode: "x", modifierKey: null, threshold: 5, onPan: () => { userZoomed = true; } },
          zoom: { wheel: { enabled: true, speed: 0.05 }, pinch: { enabled: true }, drag: { enabled: false }, mode: "x", onZoom: () => { userZoomed = true; } }
        }
      }
    }
  });

  /* ============================================================
     RENDER Y LÓGICA DE EXTREMOS (MÁX Y MÍN)
     ============================================================ */
  function getExtrema(data) {
    if (!data || !data.length) return { max: null, min: null };
    let max = { y: -Infinity, x: null };
    let min = { y: Infinity, x: null };
    data.forEach(p => {
      if (p.y !== null && Number.isFinite(p.y)) {
        if (p.y > max.y) { max = { x: p.x, y: p.y }; }
        if (p.y < min.y) { min = { x: p.x, y: p.y }; }
      }
    });
    return { max: (max.y === -Infinity ? null : max), min: (min.y === Infinity ? null : min) };
  }

  function renderChart() {
    const slice = getSlice();
    const processed = slice.map(processRow).filter(Boolean);

    const s1 = [], s2 = [], dt = [];
    let lastTs = null;

    processed.forEach(r => {
      const t = parseTs(r.created_at);
      if (!t) return;
      if (lastTs !== null && (t - lastTs) > GAP_MS) {
        const gap = lastTs + 1000;
        s1.push({ x: gap, y: null });
        s2.push({ x: gap, y: null });
        dt.push({ x: gap, y: null });
      }
      s1.push({ x: t, y: r.s1 });
      s2.push({ x: t, y: r.s2 });
      dt.push({ x: t, y: r.delta });
      lastTs = t;
    });

    tempChart.data.datasets[0].data = s2; 
    tempChart.data.datasets[1].data = s1; 
    tempChart.data.datasets[2].data = dt; 

    // --- LÓGICA DE BURBUJAS (MAX Y MIN) ---
    try {
      const annotations = {};
      if (processed.length === 0) {
        let xMin = tempChart.options.scales.x.min;
        let xMax = tempChart.options.scales.x.max;
        if (!Number.isFinite(xMin) || !Number.isFinite(xMax)) {
          const now = Date.now();
          xMin = now - (selectedHours * 3600 * 1000);
          xMax = now;
        }
        annotations.emptyLabel = {
          type: 'label',
          xValue: xMin + (xMax - xMin) / 2,
          yValue: 20,
          content: ['Sin datos en este rango'],
          font: { size: 14, weight: 'bold' },
          color: '#64748b'
        };
      } else {
        const extS1 = getExtrema(s1);
        const extS2 = getExtrema(s2);
        const extDT = getExtrema(dt);

        // --- Sonda 1 (Amarillo) ---
        if (extS1.max && seriesState[0]) {
          annotations.bubbleMaxS1 = {
            type: 'label', xValue: extS1.max.x, yValue: extS1.max.y,
            content: [extS1.max.y.toFixed(2) + ' °C', 'Máx S1'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#eab308', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#eab308', borderWidth: 1, margin: 4, position: 'bottom' }
          };
        }
        if (extS1.min && seriesState[0]) {
          annotations.bubbleMinS1 = {
            type: 'label', xValue: extS1.min.x, yValue: extS1.min.y,
            content: [extS1.min.y.toFixed(2) + ' °C', 'Mín S1'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#eab308', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#eab308', borderWidth: 1, margin: 4, position: 'top' }
          };
        }

        // --- Sonda 2 (Púrpura) ---
        if (extS2.max && seriesState[1]) {
          annotations.bubbleMaxS2 = {
            type: 'label', xValue: extS2.max.x, yValue: extS2.max.y,
            content: [extS2.max.y.toFixed(2) + ' °C', 'Máx S2'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#a855f7', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#a855f7', borderWidth: 1, margin: 4, position: 'bottom' }
          };
        }
        if (extS2.min && seriesState[1]) {
          annotations.bubbleMinS2 = {
            type: 'label', xValue: extS2.min.x, yValue: extS2.min.y,
            content: [extS2.min.y.toFixed(2) + ' °C', 'Mín S2'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#a855f7', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#a855f7', borderWidth: 1, margin: 4, position: 'top' }
          };
        }

        // --- ΔT (Rojo) ---
        if (extDT.max && seriesState[2]) {
          annotations.bubbleMaxDT = {
            type: 'label', xValue: extDT.max.x, yValue: extDT.max.y,
            content: [extDT.max.y.toFixed(2) + ' °C', 'Máx ΔT'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#ef4444', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#ef4444', borderWidth: 1, margin: 4, position: 'bottom' }
          };
        }
        if (extDT.min && seriesState[2]) {
          annotations.bubbleMinDT = {
            type: 'label', xValue: extDT.min.x, yValue: extDT.min.y,
            content: [extDT.min.y.toFixed(2) + ' °C', 'Mín ΔT'],
            backgroundColor: 'rgba(255, 255, 255, 0.95)', borderColor: '#ef4444', borderWidth: 1, borderRadius: 6,
            color: '#1e293b', font: { size: 10, weight: 'bold' }, padding: { top: 4, bottom: 4, left: 6, right: 6 },
            callout: { display: true, borderColor: '#ef4444', borderWidth: 1, margin: 4, position: 'top' }
          };
        }
      }
      tempChart.options.plugins.annotation.annotations = annotations;
    } catch (err) {
      console.error("Error al dibujar anotaciones:", err);
    }

    if (!userZoomed) {
      const now = Date.now();
      const windowMs = selectedHours * 3600 * 1000;
      if (offsetHours === 0) {
        tempChart.options.scales.x.min = now - windowMs;
        tempChart.options.scales.x.max = now;
      } else {
        const end = now - offsetHours * 3600 * 1000;
        tempChart.options.scales.x.min = end - windowMs;
        tempChart.options.scales.x.max = end;
      }
    }

    const temps = [];
    if (seriesState[0]) temps.push(...s1.map(d => d.y));
    if (seriesState[1]) temps.push(...s2.map(d => d.y));
    if (seriesState[2]) temps.push(...dt.map(d => d.y));
    const valid = temps.filter(v => v !== null && Number.isFinite(v));
    
    if (valid.length) {
      const tMin = Math.min(...valid), tMax = Math.max(...valid);
      const margin = Math.max(1, (tMax - tMin) * 0.25);
      tempChart.options.scales.y.min = Math.floor((tMin - margin) / 2) * 2;
      tempChart.options.scales.y.max = Math.ceil((tMax + margin) / 2) * 2;
    } else {
      tempChart.options.scales.y.min = 15;
      tempChart.options.scales.y.max = 35;
    }

    tempChart.update("none");
    updateTimeLabel(processed);
  }

  function updateTimeLabel(processed) {
    const el = document.getElementById("time-range-label");
    const historyInd = document.getElementById("history-indicator");
    
    if (offsetHours > 0) historyInd.classList.remove("hidden");
    else historyInd.classList.add("hidden");

    const now = Date.now();
    const endTime = now - offsetHours * 3600 * 1000;
    const startTime = endTime - selectedHours * 3600 * 1000;

    const opts = { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" };
    const s0 = new Date(startTime).toLocaleDateString([], opts);
    const s1 = new Date(endTime).toLocaleDateString([], opts);
    
    let text = `${s0} → ${s1} · ${selectedHours}h`;
    if (offsetHours > 0) text += ` · Hace ${offsetHours}h`;
    if (processed.length === 0) text += ` (Sin datos)`;
    
    el.textContent = text;
  }

  function updateStatusBar() {
    if (!latestRow) return;
    if (Number.isFinite(latestRow.bateriaVolt)) {
      const v = latestRow.bateriaVolt, p = latestRow.bateria;
      document.getElementById("bat-val").textContent = `${p}% · ${v.toFixed(2)}V`;
      const icon = document.getElementById("bat-icon");
      if (p <= 20) icon.className = "w-4 h-4 text-rose-500";
      else if (p <= 50) icon.className = "w-4 h-4 text-amber-400";
      else icon.className = "w-4 h-4 text-emerald-400";
    }
    const wifi = latestRow.wifi || "?";
    const ip = latestRow.ip ? ` · ${latestRow.ip}` : "";
    document.getElementById("wifi-val").textContent = `${wifi}${ip}`;
  }

  function updateBadge() {
    const b = document.getElementById("status-badge");
    if (b.textContent.includes("Modo Prueba")) return;

    let text, style;
    if (offsetHours > 0) {
      text = "Modo Historial"; style = "bg-purple-500/20 text-purple-400 border-purple-500/30";
    } else {
      const age = lastSeenAt ? Date.now() - lastSeenAt.getTime() : null;
      if (age !== null && age <= MAX_AGE_MS) {
        text = "En vivo · " + fmtAge(age); style = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
      } else if (age !== null) {
        text = "Desconectado · " + fmtAge(age); style = "bg-rose-500/20 text-rose-400 border-rose-500/30";
      } else {
        text = "Sin datos"; style = "bg-amber-500/20 text-amber-400 border-amber-500/30";
      }
    }
    b.textContent = text;
    b.className = "px-2 py-0.5 text-[10px] font-semibold rounded-full border truncate " + style;
  }

  function fmtAge(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return `${s} s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h} h ${m % 60} min`;
    return `${Math.floor(h / 24)} d`;
  }

  async function refreshLatest() {
    try {
      const row = await fetchJSON("/latest");
      if (row && row.created_at) {
        const t = parseTs(row.created_at);
        if (t && (!lastSeenAt || t > lastSeenAt.getTime())) lastSeenAt = new Date(t);
        latestRow = processRow(row);
        const exists = allData.some(r => r.created_at === row.created_at);
        if (!exists) {
          allData.push(row);
          allData.sort((a, b) => (parseTs(a.created_at) || 0) - (parseTs(b.created_at) || 0));
        }
        updateStatusBar();
        if (offsetHours === 0) renderChart();
      }
      updateBadge();
    } catch (e) { updateBadge(); }
  }

  async function refreshRecentHistory() {
    if (isRefreshing) return;
    isRefreshing = true;
    try {
      const recent = await fetchRange(24);
      const seen = new Set(allData.map(r => r.created_at));
      let added = 0;
      for (const row of recent) {
        if (row.created_at && !seen.has(row.created_at)) { allData.push(row); added++; }
      }
      if (added > 0) {
        allData.sort((a, b) => (parseTs(a.created_at) || 0) - (parseTs(b.created_at) || 0));
        if (offsetHours === 0) renderChart();
      }
    } catch (e) {} finally { isRefreshing = false; }
  }

  function navigateHistory(direction, reset = false) {
    if (reset) offsetHours = 0;
    else { offsetHours += direction * selectedHours; if (offsetHours < 0) offsetHours = 0; }
    
    userZoomed = false;
    if (tempChart.resetZoom) tempChart.resetZoom();
    
    const isHistory = offsetHours > 0;
    document.getElementById("btn-actual").classList.toggle("hidden", !isHistory);
    document.getElementById("btn-forward").classList.toggle("hidden", !isHistory);
    
    renderChart();
    updateBadge();
  }

  function setHours(h) {
    selectedHours = h;
    localStorage.setItem("graph-hours", h);
    document.querySelectorAll(".range-btn[data-hours]").forEach(b => {
      b.classList.toggle("active", parseInt(b.dataset.hours) === h);
    });
    
    offsetHours = 0; userZoomed = false;
    if (tempChart.resetZoom) tempChart.resetZoom();
    
    document.getElementById("btn-actual").classList.add("hidden");
    document.getElementById("btn-forward").classList.add("hidden");
    
    renderChart();
    updateBadge();
  }

  function applySeriesVisibility() {
    tempChart.setDatasetVisibility(0, seriesState[1]); 
    tempChart.setDatasetVisibility(1, seriesState[0]); 
    tempChart.setDatasetVisibility(2, seriesState[2]); 
    
    ["toggle-s1","toggle-s2","toggle-dt"].forEach((id, i) => {
      const b = document.getElementById(id);
      if (b) b.classList.toggle("active", seriesState[i]);
    });
    localStorage.setItem("graph-series", JSON.stringify(seriesState));
    renderChart();
  }

  function toggleSeries(i) {
    if (i < 0 || i > 2) return;
    const n = [...seriesState];
    n[i] = !n[i];
    if (!n.some(v => v)) return;
    seriesState = n;
    if ("vibrate" in navigator) navigator.vibrate(15);
    applySeriesVisibility();
  }

  function resetZoom() {
    userZoomed = false;
    if (tempChart.resetZoom) tempChart.resetZoom();
    renderChart();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) enterFullscreen();
    else document.exitFullscreen();
  }

  async function enterFullscreen() {
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      try {
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
      } catch (_) {}
      document.getElementById("portrait-hint").classList.add("hidden");
    } catch (e) {}
  }

  async function exitAndGoBack() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (_) {}
      }
    } catch (_) {}
    location.replace("./index.html");
  }

  let lastTap = 0;
  document.getElementById("chart-container").addEventListener("touchend", e => {
    const now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
      document.getElementById("topbar").classList.toggle("hidden-ui");
      document.getElementById("bottombar").classList.toggle("hidden-ui");
    }
    lastTap = now;
  }, { passive: false });

  history.pushState({ page: "grafica" }, "", location.href);
  window.addEventListener("popstate", () => exitAndGoBack());

  function updatePortraitHint() {
    const hint = document.getElementById("portrait-hint");
    const isPortrait = window.matchMedia("(orientation: portrait)").matches;
    const isSmall = window.innerWidth < 1024;

    if (isPortrait && isSmall) {
      hint.classList.add("force-hint");
      hint.classList.remove("hidden");
    } else {
      hint.classList.remove("force-hint");
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    if (typeof ChartAnnotation !== 'undefined') {
      Chart.register(ChartAnnotation);
    }

    const savedH = parseInt(localStorage.getItem("graph-hours"));
    if ([2,4,8,12,24].includes(savedH)) selectedHours = savedH;
    document.querySelectorAll(".range-btn[data-hours]").forEach(b => {
      b.classList.toggle("active", parseInt(b.dataset.hours) === selectedHours);
    });

    applySeriesVisibility();

    updatePortraitHint();
    window.addEventListener("resize", updatePortraitHint);
    window.addEventListener("orientationchange", () => setTimeout(updatePortraitHint, 300));

    document.querySelector("#portrait-hint button")
      ?.addEventListener("click", enterFullscreen);

    await loadAllHistory();
    await refreshLatest();
    renderChart();
    updateBadge();

    setInterval(() => { if (offsetHours === 0) refreshLatest(); }, POLL_MS);
    setInterval(() => { if (offsetHours === 0) refreshRecentHistory(); }, 60000);
    setInterval(updateBadge, 2000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && offsetHours === 0) {
        refreshLatest();
        refreshRecentHistory();
      }
    });
  });
</script>

</body>
</html>
